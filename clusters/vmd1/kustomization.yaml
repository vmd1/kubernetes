apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flux-system
  # Foundation, in dependency order
  - node-labels.yaml
  - namespaces.yaml
  - crds.yaml
  - operators.yaml
  # Admission policies and quotas: nothing depends on this layer, so a broken policy cannot hold up a group
  - policies.yaml
  # Purpose groups: each depends only on operators, so one broken group cannot hold up another
  - vpn.yaml
  - oci.yaml
  - proxy.yaml
  - auth.yaml
  - platform.yaml
  - observability.yaml
  - home.yaml
  - media.yaml
  - personal.yaml
  - projects.yaml
  - edge.yaml
