apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Labels on the flux-system Namespace (declared in gotk-components.yaml, which `flux bootstrap` regenerates).
# `flux bootstrap` rewrites this file too: re-add this patch afterwards.
patches:
- target:
    kind: Namespace
    name: flux-system
  patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
      labels:
        vmd1.homelab/tier: system
        pod-security.kubernetes.io/audit: restricted
# Keep the four controllers in uk-home and prefer hades-02: hades-01 is the control plane and is memory- and CPU-starved
# (resources/k3s-config/README.md). Preferred, not required: if hades-02 is down they schedule on hades-01 as before.
# `flux bootstrap` rewrites this file: re-add this patch afterwards.
- target:
    kind: Deployment
    namespace: flux-system
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-important
    spec:
      template:
        spec:
          nodeSelector:
            topology.kubernetes.io/zone: uk-home
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - {key: kubernetes.io/hostname, operator: In, values: [hades-02]}
