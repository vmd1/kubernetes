# netpol-db-operator: egress for the CloudNativePG operator to the database namespaces (instance manager status
# on 8000, Postgres on 5432), selected by vmd1.homelab/db-server=true. Include with netpol-api-server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-db-operator
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              vmd1.homelab/db-server: "true"
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 5432}
