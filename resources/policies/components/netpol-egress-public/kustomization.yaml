apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# impl/ fills the placeholders from the ranges ConfigMap through `replacements`. Kustomize applies
# patches before replacements inside one kustomization, so the ConfigMap can only be dropped here, one layer up.
# Without this, two enrolled apps in one group (e.g. observability) both carry a ConfigMap of the same id and
# the group's build fails with "may not add resource with an already registered id".
components:
  - impl

patches:
  - target: {kind: ConfigMap, name: cluster-ranges-egress-public}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cluster-ranges-egress-public
