# rbac-bindings: only subjects listed in the policy-cluster-admin-subjects ConfigMap may be bound to cluster-admin, plus the
# kube-system/helm-* ServiceAccounts that the k3s helm-controller creates (and binds to cluster-admin) for every HelmChart install.
# rbac-roles: no wildcard verbs or resources in Roles/ClusterRoles. Excepted: system: roles and the vendor roles installed
# outside this repo (Flux's gotk, k3s built-ins, Longhorn, Multus, local-path, prometheus-operator), which need wildcards.
# Any new role that needs one must be added to the list below in the same PR.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-rbac-bindings
spec:
  failurePolicy: Ignore
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterrolebindings", "rolebindings"]
  matchConditions:
    - name: cluster-admin-only
      expression: "object.roleRef.name == 'cluster-admin'"
  validations:
    - expression: >-
        object.?subjects.orValue([]).all(s,
        (s.kind + '/' + s.?namespace.orValue('') + '/' + s.name) in params.data['subjects'].split(',') ||
        (s.kind + '/' + s.?namespace.orValue('') + '/' + s.name).startsWith('ServiceAccount/kube-system/helm-'))
      message: "cluster-admin may only be bound to subjects listed in kube-system/policy-cluster-admin-subjects"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-rbac-roles
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles", "roles"]
  matchConditions:
    - name: not-built-in
      expression: >-
        !object.metadata.name.startsWith('system:') &&
        !(object.metadata.name in ['cluster-admin', 'admin', 'edit', 'view', 'crd-controller-flux-system',
        'flux-edit-flux-system', 'flux-view-flux-system', 'k3s-cloud-controller-manager', 'local-path-provisioner-role',
        'longhorn-role', 'longhorn', 'monitoring-kube-prometheus-operator', 'multus', 'rke2-multus', 'whereabouts'])
  validations:
    - expression: >-
        object.?rules.orValue([]).all(r,
        !('*' in r.?verbs.orValue([])) && !('*' in r.?resources.orValue([])))
      message: "wildcard verbs or resources are not allowed in roles"
