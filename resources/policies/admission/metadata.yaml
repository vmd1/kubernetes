# metadata: tier=app pods carry app.kubernetes.io/name, so selectors (netpols, scrapes) stay reliable.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-metadata
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: "object.metadata.?labels['app.kubernetes.io/name'].orValue('') != ''"
      message: "pods need the app.kubernetes.io/name label"
