# storage: hostPath volumes must sit under a prefix in the policy-hostpath-allowlist ConfigMap, unless the namespace
# is labelled policy.vmd1.homelab/allow-privileged=true.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-storage
spec:
  failurePolicy: Ignore
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: allowPrivileged
      expression: "namespaceObject.metadata.?labels['policy.vmd1.homelab/allow-privileged'].orValue('') == 'true'"
  validations:
    - expression: >-
        variables.allowPrivileged || object.spec.?volumes.orValue([]).all(v, !has(v.hostPath) ||
        params.data['prefixes'].split(',').exists(p, v.hostPath.path == p || v.hostPath.path.startsWith(p + '/')))
      message: "hostPath volumes must be under a prefix in kube-system/policy-hostpath-allowlist"
