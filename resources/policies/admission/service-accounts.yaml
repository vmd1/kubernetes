# service-accounts: a pod either runs under a dedicated ServiceAccount (a deliberate choice, e.g. an operator that
# talks to the API) or, on the default one, must not get a token mounted.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-service-accounts
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.?serviceAccountName.orValue('default') != 'default' ||
        !object.spec.?automountServiceAccountToken.orValue(true)
      message: "use a dedicated ServiceAccount, or set automountServiceAccountToken: false on the default one"
