# app-hardening: tier=app pods must run non-root, without privilege escalation, with a read-only root
# filesystem and a seccomp profile, from a pinned image (digest, or a tag other than latest).
# Container-level securityContext wins over the pod-level one, as in Kubernetes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-app-hardening
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    # Legacy exemptions, owned in resources/namespaces/namespaces.yaml (never labels on the pod). Each label is a
    # tracked debt: remove it once the namespace's images run non-root / with a read-only root filesystem.
    - name: allowRoot
      expression: "namespaceObject.metadata.?labels['policy.vmd1.homelab/allow-root'].orValue('') == 'true'"
    - name: allowWritableRoot
      expression: "namespaceObject.metadata.?labels['policy.vmd1.homelab/allow-writable-rootfs'].orValue('') == 'true'"
    - name: allowEscalation
      expression: "namespaceObject.metadata.?labels['policy.vmd1.homelab/allow-privilege-escalation'].orValue('') == 'true'"
  validations:
    - expression: "variables.allowRoot || variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)))"
      message: "every container must set runAsNonRoot: true (container or pod securityContext)"
    - expression: "variables.allowEscalation || variables.containers.all(c, !c.?securityContext.?allowPrivilegeEscalation.orValue(true))"
      message: "every container must set allowPrivilegeEscalation: false"
    - expression: "variables.allowWritableRoot || variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false))"
      message: "every container must set readOnlyRootFilesystem: true"
    - expression: >-
        variables.containers.all(c,
        c.?securityContext.?seccompProfile.?type.orValue(object.spec.?securityContext.?seccompProfile.?type.orValue('')) in ['RuntimeDefault','Localhost'])
      message: "every container needs a seccomp profile of RuntimeDefault or Localhost"
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:') ||
        (c.image.lastIndexOf(':') > c.image.lastIndexOf('/') && !c.image.endsWith(':latest')))
      message: "images must be pinned by digest or use a tag other than latest"
