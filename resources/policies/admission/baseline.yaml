# baseline: no privileged containers, host namespaces or extra capabilities.
# Pods only (CREATE); bound to tier=app and tier=infra. Exemptions are namespace labels owned in
# resources/namespaces/namespaces.yaml, never labels on the pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-baseline
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: allowHostNetwork
      expression: "namespaceObject.metadata.?labels['policy.vmd1.homelab/allow-host-network'].orValue('') == 'true'"
    - name: allowPrivileged
      expression: "namespaceObject.metadata.?labels['policy.vmd1.homelab/allow-privileged'].orValue('') == 'true'"
  validations:
    - expression: "variables.allowHostNetwork || !object.spec.?hostNetwork.orValue(false)"
      message: "hostNetwork is not allowed here (namespace needs policy.vmd1.homelab/allow-host-network=true)"
    - expression: "!object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false)"
      message: "hostPID and hostIPC are not allowed"
    - expression: "variables.allowPrivileged || variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))"
      message: "privileged containers are not allowed here (namespace needs policy.vmd1.homelab/allow-privileged=true)"
    - expression: >-
        variables.allowPrivileged || variables.containers.all(c,
        c.?securityContext.?capabilities.?add.orValue([]).all(x,
        x in ['AUDIT_WRITE','CHOWN','DAC_OVERRIDE','FOWNER','FSETID','KILL','MKNOD','NET_BIND_SERVICE','SETFCAP','SETGID','SETPCAP','SETUID','SYS_CHROOT']))
      message: "added capabilities beyond the Pod Security baseline set are not allowed"
