# namespace-tier: every Namespace carries vmd1.homelab/tier, which the other policies and the netpol components select on.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vmd1-namespace-tier
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  validations:
    - expression: "object.metadata.?labels['vmd1.homelab/tier'].orValue('') in ['app','infra','system']"
      message: "Namespaces need vmd1.homelab/tier=app|infra|system (add it in resources/namespaces/namespaces.yaml)"
