# Object-count and storage quotas for every tier=app and tier=infra namespace. Sized from usage on 2026-10-25:
#   pods = max(10, 3 x running pods), persistentvolumeclaims = max(3, 2 x PVCs + 2), requests.storage = max(20Gi, 2 x requested + 10Gi),
# each rounded up to 5. Raise a value here, in the same PR, when an app legitimately grows.
# Deliberately no cpu/memory quota and no LimitRange: a compute quota rejects pods that omit requests, and a
# LimitRange would inject default limits into running apps. Neither can run in a warn-only mode.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: authelia
  labels:
    vmd1.homelab/policy: quota-default
spec:
  hard:
    pods: "10"
    persistentvolumeclaims: "5"
    requests.storage: "20Gi"
---
