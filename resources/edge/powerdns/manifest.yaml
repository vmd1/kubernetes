---
apiVersion: v1
kind: ConfigMap
metadata:
  name: powerdns-config
  namespace: powerdns
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: powerdns
  namespace: powerdns
  labels:
    app: powerdns
spec:
  selector:
    matchLabels:
      app: powerdns
  template:
    metadata:
      labels:
        app: powerdns
    spec:
      hostNetwork: true
      terminationGracePeriodSeconds: 5
      nodeSelector:
        node-role.kubernetes.io/ingress: "true"
      tolerations:
        - operator: Exists
      initContainers:
        # GeoLite2-City.mmdb (needed for pickclosest geo distance) is kept fresh by the geoip-updater DaemonSet in
        # /var/lib/geoip. Wait for it; if MaxMind is unreachable and the file never shows up, fall back to this
        # node's old per-node cache so DNS can still start.
        - name: wait-geoip-db
          image: ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              DB=/geoip/GeoLite2-City.mmdb
              i=0
              while [ "$i" -lt 120 ]; do
                if [ -s "$DB" ]; then echo "GeoLite2-City.mmdb is present ($(stat -c %s "$DB") bytes)"; exit 0; fi
                echo "waiting for geoip-updater to provide $DB..."
                i=$((i + 1))
                sleep 5
              done
              if [ -s /legacy/GeoLite2-City.mmdb ]; then
                echo "falling back to the old per-node cache"
                cp /legacy/GeoLite2-City.mmdb "$DB.tmp" && mv "$DB.tmp" "$DB"
                exit 0
              fi
              echo "no GeoIP database available"
              exit 1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: geoip
              mountPath: /geoip
            - name: geoip-legacy
              mountPath: /legacy
              readOnly: true

      containers:
        - name: pdns
          image: dl010/powerdns-auth:5.0.8@sha256:3425187666cbf44537cc9b799f6cd9b76319d479470015d9dab56e278120f140
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            # geoip serves ingress.vmd1.homelab (generated by the operator); bind serves the shadow zones for Tailscale
            # split DNS (see README, "Shadow zones"). Zones are the most specific match, so ingress.vmd1.homelab and
            # ts.ingress.vmd1.homelab never fall into the vmd1.homelab shadow zone's wildcard.
            - name: PDNS_launch
              value: "geoip,bind"
            - name: PDNS_bind_config
              value: "/etc/powerdns/shadow/named.conf"
            - name: PDNS_geoip_database_files
              value: "/geoip/GeoLite2-City.mmdb"
            - name: PDNS_geoip_zones_file
              value: "/etc/powerdns/zones/geoip-zones.yaml"
            - name: PDNS_enable_lua_records
              value: "yes"
            - name: PDNS_max_cache_entries
              value: "20000"
            - name: PDNS_max_packet_cache_entries
              value: "20000"
            - name: PDNS_distributor_threads
              value: "1"
            - name: PDNS_receiver_threads
              value: "2"
            - name: PDNS_local_port
              value: "53"
            - name: PDNS_socket_dir
              value: "/var/run"
            - name: PDNS_edns_subnet_processing
              value: "yes"
            # "anonymous" makes version.bind / version.pdns answer REFUSED instead of the exact build string.
            - name: PDNS_version_string
              value: "anonymous"
            - name: PDNS_loglevel
              value: "9"
            - name: PDNS_primary
              value: "yes"
            - name: PDNS_allow_axfr_ips
              value: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
            - name: PDNS_webserver
              value: "yes"
            - name: PDNS_webserver_address
              value: "127.0.0.1"
            - name: PDNS_webserver_port
              value: "8081"
            - name: PDNS_api
              value: "yes"
            - name: PDNS_api_key
              valueFrom:
                secretKeyRef:
                  name: powerdns-secrets
                  key: PDNS_API_KEY
            - name: PDNS_setuid
              value: "0"
            - name: PDNS_setgid
              value: "0"

          ports:
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              protocol: UDP
              name: dns-udp

          volumeMounts:
            # The directory, not a single file: geoipupdate replaces the file atomically (new inode), which a subPath
            # mount would never see.
            - name: geoip
              mountPath: /geoip
              readOnly: true
            - name: config-volume
              mountPath: /etc/powerdns/zones
            - name: shadow-zones
              mountPath: /etc/powerdns/shadow
              readOnly: true
            - name: run-volume
              mountPath: /var/run
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

        - name: config-watcher
          image: dl010/powerdns-auth:5.0.8@sha256:3425187666cbf44537cc9b799f6cd9b76319d479470015d9dab56e278120f140
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              echo "[config-watcher] Starting ConfigMap symlink and GeoIP database watcher..."
              last_target=""
              db=/geoip/GeoLite2-City.mmdb
              last_db=$(stat -c '%i-%Y-%s' "$db" 2>/dev/null || echo none)
              shadow=/etc/powerdns/shadow/named.conf
              last_shadow=$(readlink -f "$shadow" 2>/dev/null || echo none)
              while true; do
                # shadow zones (bind backend): a ConfigMap update swaps the ..data symlink; rediscover picks up added
                # or removed zones and bind-reload-now re-reads each zone file (verified in a throwaway pod).
                cur_shadow=$(readlink -f "$shadow" 2>/dev/null || echo none)
                if [ "$cur_shadow" != "none" ] && [ "$cur_shadow" != "$last_shadow" ]; then
                  echo "[config-watcher] shadow zones changed ($last_shadow -> $cur_shadow), reloading..."
                  pdns_control --socket-dir=/var/run rediscover
                  ok=1
                  for z in $(sed -n 's/^zone "\([^"]*\)".*/\1/p' "$shadow"); do
                    pdns_control --socket-dir=/var/run bind-reload-now "$z" || ok=0
                  done
                  if [ "$ok" = 1 ]; then last_shadow="$cur_shadow"; fi
                fi
                if [ -L /etc/powerdns/zones/geoip-zones.yaml ]; then
                  current_target=$(readlink -f /etc/powerdns/zones/geoip-zones.yaml)
                  if [ "$current_target" != "$last_target" ]; then
                    if [ -n "$last_target" ]; then
                      echo "[config-watcher] ConfigMap change detected: $last_target -> $current_target"
                      echo "[config-watcher] Running pdns_control reload..."
                      pdns_control --socket-dir=/var/run reload
                    fi
                    last_target="$current_target"
                  fi
                fi
                # geoipupdate replaces the database with a new file; pdns keeps the old one mapped until reloaded
                # (verified: pdns_control reload re-opens it). Retry every 10 s until the reload succeeds.
                cur_db=$(stat -c '%i-%Y-%s' "$db" 2>/dev/null || echo none)
                if [ "$cur_db" != "none" ] && [ "$cur_db" != "$last_db" ]; then
                  echo "[config-watcher] GeoIP database changed ($last_db -> $cur_db), running pdns_control reload..."
                  if pdns_control --socket-dir=/var/run reload; then last_db="$cur_db"; fi
                fi
                sleep 10
              done
          volumeMounts:
            - name: config-volume
              mountPath: /etc/powerdns/zones
            - name: shadow-zones
              mountPath: /etc/powerdns/shadow
              readOnly: true
            - name: run-volume
              mountPath: /var/run
            - name: geoip
              mountPath: /geoip
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

      volumes:
        - name: geoip
          hostPath:
            path: /var/lib/geoip # written by the geoip-updater DaemonSet
            type: DirectoryOrCreate
        - name: geoip-legacy
          hostPath:
            path: /var/lib/powerdns/geoip # the old per-node cache, only used as a fallback by wait-geoip-db
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: powerdns-config
            defaultMode: 0755
        - name: shadow-zones
          configMap:
            name: powerdns-shadow-zones
        - name: run-volume
          emptyDir: {}