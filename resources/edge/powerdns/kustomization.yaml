apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - secondary.yaml
  - lan-dns.yaml
  - operator.yaml
  - secrets.sops.yaml
  - primary

# Generated by `node dns/shadow/render.js` (CI fails if they are stale). No name hash: the config-watcher sidecar
# reloads the zones in place when the ConfigMap changes, so DNS pods are not restarted for a zone edit.
configMapGenerator:
  - name: powerdns-shadow-zones
    namespace: powerdns
    files:
      - shadow-zones/named.conf
      - shadow-zones/named.secondary.conf
      - shadow-zones/vmd1.homelab.zone
      - shadow-zones/vmd1.homelab.zone
      - shadow-zones/vmd1.homelab.zone
      - shadow-zones/vmd1.homelab.zone
      - shadow-zones/ts.ingress.vmd1.homelab.zone
      - shadow-zones/ts.int.vmd1.homelab.zone
      - shadow-zones/vmd1.homelab.rrsets.json
      - shadow-zones/vmd1.homelab.rrsets.json
      - shadow-zones/vmd1.homelab.rrsets.json
      - shadow-zones/vmd1.homelab.rrsets.json
      - shadow-zones/ts.ingress.vmd1.homelab.rrsets.json
      - shadow-zones/ts.int.vmd1.homelab.rrsets.json
generatorOptions:
  disableNameSuffixHash: true
