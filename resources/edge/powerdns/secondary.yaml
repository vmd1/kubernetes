# The PowerDNS secondaries: one pod per ingress node that carries dns.vmd1.homelab/mode=secondary (the legacy `powerdns`
# DaemonSet in manifest.yaml runs everywhere else, so a node moves over by getting the label, one at a time).
#
# Serves every zone by pulling it from the primary (powerdns-primary Service, see primary/) with the bind backend. The
# primary is a ClusterIP Service, so there is no NOTIFY path (its NOTIFYs would come from a pod address that is not the
# configured master); the zones' SOA refresh is 30 s and that is how a change arrives. Zone files persist on the node,
# so a restart serves what it had until the first refresh succeeds.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: powerdns-secondary
  namespace: powerdns
  labels:
    app: powerdns-secondary
spec:
  selector:
    matchLabels:
      app: powerdns-secondary
  template:
    metadata:
      labels:
        app: powerdns-secondary
    spec:
      hostNetwork: true
      terminationGracePeriodSeconds: 5
      nodeSelector:
        node-role.kubernetes.io/ingress: "true"
        dns.vmd1.homelab/mode: secondary
      tolerations:
        - operator: Exists
      initContainers:
        # Same wait as the legacy DaemonSet: the geoip-updater DaemonSet keeps /var/lib/geoip fresh; fall back to the
        # old per-node cache if MaxMind is unreachable.
        - name: wait-geoip-db
          image: ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              DB=/geoip/GeoLite2-City.mmdb
              i=0
              while [ "$i" -lt 120 ]; do
                if [ -s "$DB" ]; then echo "GeoLite2-City.mmdb is present"; exit 0; fi
                echo "waiting for geoip-updater to provide $DB..."
                i=$((i + 1))
                sleep 5
              done
              if [ -s /legacy/GeoLite2-City.mmdb ]; then
                echo "falling back to the old per-node cache"
                cp /legacy/GeoLite2-City.mmdb "$DB.tmp" && mv "$DB.tmp" "$DB"
                exit 0
              fi
              echo "no GeoIP database available"
              exit 1
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - {name: geoip, mountPath: /geoip}
            - {name: geoip-legacy, mountPath: /legacy, readOnly: true}
        # named.secondary.conf has @PRIMARY@ where the master goes. kubelet put the primary Service's address in this
        # pod's environment (hostNetwork pods get the service variables too), so it is filled in here and git never
        # names an address.
        - name: render-conf
          image: dl010/powerdns-auth:5.0.8@sha256:3425187666cbf44537cc9b799f6cd9b76319d479470015d9dab56e278120f140
          command:
            - sh
            - -c
            - |
              test -n "$POWERDNS_PRIMARY_SERVICE_HOST" || { echo "POWERDNS_PRIMARY_SERVICE_HOST is not set"; exit 1; }
              sed "s/@PRIMARY@/$POWERDNS_PRIMARY_SERVICE_HOST/" /etc/powerdns/shadow/named.secondary.conf > /conf/named.conf
              # The geoip backend serves no zone of its own here; it is loaded because the LUA records
              # (pickclosest) look client locations up through it.
              echo "domains: []" > /conf/geoip-zones.yaml
          volumeMounts:
            - {name: shadow-zones, mountPath: /etc/powerdns/shadow, readOnly: true}
            - {name: conf, mountPath: /conf}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: pdns
          image: dl010/powerdns-auth:5.0.8@sha256:3425187666cbf44537cc9b799f6cd9b76319d479470015d9dab56e278120f140
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - {name: PDNS_launch, value: "bind,geoip"}
            - {name: PDNS_geoip_database_files, value: /geoip/GeoLite2-City.mmdb}
            - {name: PDNS_geoip_zones_file, value: /conf/geoip-zones.yaml}
            - {name: PDNS_bind_config, value: /conf/named.conf}
            - {name: PDNS_secondary, value: "yes"}
            - {name: PDNS_enable_lua_records, value: "yes"}
            - {name: PDNS_edns_subnet_processing, value: "yes"}
            - {name: PDNS_version_string, value: anonymous}
            - {name: PDNS_max_cache_entries, value: "20000"}
            - {name: PDNS_max_packet_cache_entries, value: "20000"}
            - {name: PDNS_distributor_threads, value: "1"}
            - {name: PDNS_receiver_threads, value: "2"}
            - {name: PDNS_local_port, value: "53"}
            - {name: PDNS_socket_dir, value: /var/run}
            - {name: PDNS_loglevel, value: "9"}
            # Never answer an AXFR here: only the primary hands zones out (Cloudflare used to ask the old primaries).
            - {name: PDNS_allow_axfr_ips, value: "XXX.XXX.XXX.XXX"}
            - {name: PDNS_xfr_cycle_interval, value: "10"}
            - {name: PDNS_setuid, value: "0"}
            - {name: PDNS_setgid, value: "0"}
          ports:
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: dns-udp, containerPort: 53, protocol: UDP}
          volumeMounts:
            - {name: conf, mountPath: /conf, readOnly: true}
            - {name: geoip, mountPath: /geoip, readOnly: true}   # the directory: geoipupdate replaces the file atomically
            - {name: zonefiles, mountPath: /var/lib/powerdns-secondary}
            - {name: run, mountPath: /var/run}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
        # A zone added to or removed from the config: re-render named.conf and have pdns rediscover the zone list.
        - name: config-watcher
          image: dl010/powerdns-auth:5.0.8@sha256:3425187666cbf44537cc9b799f6cd9b76319d479470015d9dab56e278120f140
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              src=/etc/powerdns/shadow/named.secondary.conf
              last=$(readlink -f "$src" 2>/dev/null || echo none)
              db=/geoip/GeoLite2-City.mmdb
              last_db=$(stat -c '%i-%Y-%s' "$db" 2>/dev/null || echo none)
              while true; do
                # geoipupdate swaps the database for a new file; pdns keeps the old one mapped until reloaded
                cur_db=$(stat -c '%i-%Y-%s' "$db" 2>/dev/null || echo none)
                if [ "$cur_db" != none ] && [ "$cur_db" != "$last_db" ]; then
                  echo "[config-watcher] GeoIP database changed, reloading"
                  pdns_control --socket-dir=/var/run reload && last_db="$cur_db"
                fi
                cur=$(readlink -f "$src" 2>/dev/null || echo none)
                if [ "$cur" != none ] && [ "$cur" != "$last" ]; then
                  echo "[config-watcher] zone list changed, re-rendering"
                  sed "s/@PRIMARY@/$POWERDNS_PRIMARY_SERVICE_HOST/" "$src" > /conf/named.conf.new && mv /conf/named.conf.new /conf/named.conf \
                    && pdns_control --socket-dir=/var/run rediscover && last="$cur"
                fi
                sleep 10
              done
          volumeMounts:
            - {name: shadow-zones, mountPath: /etc/powerdns/shadow, readOnly: true}
            - {name: conf, mountPath: /conf}
            - {name: geoip, mountPath: /geoip, readOnly: true}
            - {name: run, mountPath: /var/run}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
      volumes:
        - {name: shadow-zones, configMap: {name: powerdns-shadow-zones}}
        - {name: conf, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - name: geoip
          hostPath:
            path: /var/lib/geoip   # written by the geoip-updater DaemonSet
            type: DirectoryOrCreate
        - name: geoip-legacy
          hostPath:
            path: /var/lib/powerdns/geoip   # the old per-node cache, only a fallback for wait-geoip-db
            type: DirectoryOrCreate
        - name: zonefiles
          hostPath:
            path: /var/lib/powerdns/secondary
            type: DirectoryOrCreate
