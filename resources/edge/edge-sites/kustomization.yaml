apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - shared.yaml
  - redirects.yaml
  - manifest.yaml
  - operator-rbac.yaml
  - operator-deployment.yaml
  - secrets.sops.yaml
  - sites/gossip.yaml
  - sites/vmd1-dev.yaml
  - sites/router-console.yaml

components:
  - ../../policies/components/netpol-baseline
  # the edge-operator calls the API server; builds and site fetches reach the registry and GitHub on the internet
  - ../../policies/components/netpol-egress-public
  - ../../policies/components/netpol-api-server

patches:
  # Components carry no namespace; the ports Traefik routes to (and the kubelet probes) replace the closed placeholder.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: vmd1-web}
  # Each component's private vars ConfigMap (a replacement source, never rendered on its own) also needs the namespace, so two
  # enrolled apps in one Flux group do not collide on its name.
  - target: {kind: ConfigMap, name: "cluster-ranges-.*"}
    patch: |-
      - {op: add, path: /metadata/namespace, value: vmd1-web}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports, value: [{protocol: TCP, port: 80}, {protocol: TCP, port: 8080}]}
