apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - shared.yaml
  - redirects.yaml
  - manifest.yaml
  - operator-rbac.yaml
  - operator-deployment.yaml
  - secrets.sops.yaml
  - sites/gossip.yaml
  - sites/vmd1-dev.yaml
  - sites/router-console.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-egress-any
  - ../../policies/components/netpol-api-server

patches:
  # edge-sites DaemonSet (80 via Traefik, 9100 metrics) and edge-operator (Kubernetes API). Egress stays open: the router-console site proxies to the LAN router.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: vmd1-web}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 80}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 9100}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: edge-operator}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: edge-operator}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: edge-operator}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: operator, securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65534}}
  - target: {kind: DaemonSet, name: edge-sites}
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: edge-sites}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: edge-sites}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: edge, securityContext: {allowPrivilegeEscalation: false}}
