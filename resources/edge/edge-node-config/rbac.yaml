# Nodes (group system:nodes) may read EdgeNodeConfig objects (noded config agent) and FirewallRule objects (noded host firewall), nothing else new. They already patch their own Node
# (annotations) through the NodeRestriction admission plugin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-node-config-reader
rules:
  - apiGroups: [edge.vmd1.homelab]
    resources: [edgenodeconfigs]
    verbs: [get, list, watch]
  - apiGroups: [network.vmd1.homelab]
    resources: [firewallrules]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-node-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edge-node-config-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:nodes
