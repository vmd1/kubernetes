# Canary for apiRoles: enforce on hera-02 only (mode: try reverts it automatically if the node does not stay healthy).
# The Tailscale grant `vmd1.homelab/cap/noded` (group:admin to tag:k3s tcp 7777, role admin) is in tailscale/policy.hujson;
# `nodectl whoami <node>` must show "role admin" and "roles are enforce". Once verified, move apiRoles into defaults.yaml and delete this object.
apiVersion: edge.vmd1.homelab/v1alpha1
kind: EdgeNodeConfig
metadata:
  name: apiroles-canary
spec:
  nodeSelector:
    kubernetes.io/hostname: hera-02
  mode: try
  tryTimeoutSeconds: 300
  apiRoles: enforce
