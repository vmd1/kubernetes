-- Public DoT/DoH front end of the edge resolver. unbound (XXX.XXX.XXX.XXX:5353, same pod) does the recursion.
-- The client picks its blocklists with the hostname it connects to:
--   ads-trackers.dns.vmd1.homelab   blocks everything on the "ads" and "trackers" Blocklists
--   dns.vmd1.homelab                no blocking
-- (DoT: TLS SNI. DoH: Host header, or ?blocklists=ads,trackers.) The lists come from /lists, kept current by the sync sidecar.

local DOMAIN_SUFFIX = ".dns.vmd1.homelab"
local LISTS_DIR = "/lists"
local MAX_PROFILE_LISTS = 8

-- Listeners. DoT arrives through Traefik as raw TCP with a PROXY protocol v2 header (the real client address);
-- DoH arrives from Traefik as plain HTTP with X-Forwarded-For. Only the pod network may talk to either.
setProxyProtocolACL({"XXX.XXX.XXX.XXX/16"})
addTLSLocal("XXX.XXX.XXX.XXX:8853", "/certs/tls.crt", "/certs/tls.key", {minTLSVersion = "tls1.2", ignoreTLSConfigurationErrors = false})
addDOHLocal("XXX.XXX.XXX.XXX:8053", nil, nil, "/dns-query", {trustForwardedForHeader = true, keepIncomingHeaders = true})

-- Open to the internet on purpose (a public resolver); abuse is bounded below.
setACL({"XXX.XXX.XXX.XXX/0", "::/0"})

newServer({address = "XXX.XXX.XXX.XXX:5353", name = "unbound", checkInterval = 5, maxCheckFailures = 3})

-- Limits per client address (v4 /32, v6 /56)
setMaxTCPConnectionsPerClient(10)
setMaxTCPQueriesPerConnection(100)
setMaxTCPConnectionDuration(120)
addAction(MaxQPSIPRule(50, 32, 56, 200), DropAction())

-- Small cache: blocklist decisions are made before the cache is consulted, so it can be shared by every profile.
getPool(""):setCache(newPacketCache(5000, {maxTTL = 3600, minTTL = 10, temporaryFailureTTL = 30, staleTTL = 60}))

-- ---------------------------------------------------------------- blocklists
local lists = {}      -- name -> {smn = SuffixMatchNode, sha = "..."}
local profiles = {}   -- profile string -> array of list names (memoised)

local function readFile(path)
  local f = io.open(path, "r")
  if not f then return nil end
  local s = f:read("*a")
  f:close()
  return s
end

local function loadList(name)
  local smn = newSuffixMatchNode()
  local count = 0
  for line in io.lines(LISTS_DIR .. "/" .. name .. ".txt") do
    if line ~= "" then
      if pcall(function() smn:add(line) end) then count = count + 1 end
    end
  end
  return smn, count
end

-- One list per call so a large refresh does not hold the Lua lock (and so stall queries) for long.
local function syncLists(onlyFirst)
  local text = readFile(LISTS_DIR .. "/index")
  if not text then return false end
  local wanted = {}
  local pending = false
  for name, sha in text:gmatch("(%w+)\t(%x+)\t[^\n]*\n") do
    wanted[name] = true
    local have = lists[name]
    local done = readFile(LISTS_DIR .. "/" .. name .. ".sha")
    if done and done:gsub("%s+", "") == sha and (not have or have.sha ~= sha) then
      if pending and onlyFirst then return true end
      local ok, smn, count = pcall(loadList, name)
      if ok then
        lists[name] = {smn = smn, sha = sha}
        infolog("blocklist " .. name .. ": loaded " .. count .. " domains")
      else
        warnlog("blocklist " .. name .. ": load failed: " .. tostring(smn))
      end
      pending = true
      if onlyFirst then return true end
    end
  end
  for name in pairs(lists) do
    if not wanted[name] then
      lists[name] = nil
      infolog("blocklist " .. name .. ": removed")
    end
  end
  collectgarbage()
  return pending
end

-- initial load: everything that is already on disk
for _ = 1, 64 do
  if not syncLists(true) then break end
end

local function profileFor(prefix)
  local p = profiles[prefix]
  if p then return p end
  p = {}
  for item in prefix:gmatch("[^-,]+") do
    if #p < MAX_PROFILE_LISTS then table.insert(p, item) end
  end
  profiles[prefix] = p
  return p
end

local function hostPrefix(host)
  host = host:lower()
  if #host > #DOMAIN_SUFFIX and host:sub(-#DOMAIN_SUFFIX) == DOMAIN_SUFFIX then
    return host:sub(1, #host - #DOMAIN_SUFFIX)
  end
  return nil
end

local function blockFilter(dq)
  local prefix = hostPrefix(dq:getServerNameIndication() or "")
  if not prefix then
    prefix = hostPrefix(dq:getHTTPHost() or "")
  end
  if not prefix then
    local q = dq:getHTTPQueryString() or ""
    prefix = q:match("blocklists=([%w,%%-]+)")
    if prefix then prefix = prefix:gsub("%%2[cC]", ",") end
  end
  if not prefix then return DNSAction.None, "" end
  for _, name in ipairs(profileFor(prefix)) do
    local l = lists[name]
    if l and l.smn:check(dq.qname) then
      return DNSAction.Nxdomain, ""
    end
  end
  return DNSAction.None, ""
end
addAction(AllRule(), LuaAction(blockFilter))

-- ---------------------------------------------------------------- housekeeping (runs once a second)
local tick = 0
function maintenance()
  tick = tick + 1
  if tick % 30 == 0 then
    -- the sync sidecar updates /lists; load at most one new or changed list per pass (cheap when nothing changed)
    syncLists(true)
  end
  if tick % 21600 == 0 then
    -- cert-manager renews the certificate in place (the Secret volume follows); pick it up without a restart
    reloadAllCertificates()
  end
end
