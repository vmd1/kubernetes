# Recursive resolver behind dnsdist. Listens on the pod loopback only; dnsdist is the public face (TLS, ACL, rate limits, blocking).
server:
    username: ""
    chroot: ""
    pidfile: ""
    interface: XXX.XXX.XXX.XXX@5353
    access-control: XXX.XXX.XXX.XXX/32 allow
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: no
    qname-minimisation: yes
    harden-glue: yes
    harden-referral-path: yes
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 3600
    cache-min-ttl: 60
    # small caches and one thread: these run on 1 GB nodes next to Traefik, PowerDNS and the rest of the edge stack
    msg-cache-size: 4m
    rrset-cache-size: 8m
    key-cache-size: 2m
    neg-cache-size: 1m
    num-threads: 1
    outgoing-range: 256
    num-queries-per-thread: 512
    so-reuseport: no
    verbosity: 1
    # QE Comp 2026 (qerobotics.co.uk): the apex and every name below it answer with a CNAME to the ingress (a redirect zone
    # rewrites the query name; unbound resolves the target and returns the whole chain).
    local-zone: "qerobotics.co.uk." redirect
    local-data: "qerobotics.co.uk. 60 IN CNAME ingress.vmd1.homelab."
