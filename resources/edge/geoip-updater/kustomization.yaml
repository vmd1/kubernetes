apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  # database downloads from the internet
  - ../../policies/components/netpol-egress-public

patches:
  # Components carry no namespace; the ports Traefik routes to (and the kubelet or API server call) replace the closed placeholder.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: geoip}
  # Each component's private vars ConfigMap (a replacement source, never rendered on its own) also needs the namespace, so two
  # enrolled apps in one Flux group do not collide on its name.
  - target: {kind: ConfigMap, name: "cluster-ranges-.*"}
    patch: |-
      - {op: add, path: /metadata/namespace, value: geoip}
