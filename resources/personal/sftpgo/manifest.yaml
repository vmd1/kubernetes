apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-pvc
  namespace: sftpgo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftpgo
  namespace: sftpgo
  labels:
    app: sftpgo
spec:
  replicas: 1
  # One writer on the RWO volume (SQLite database, host keys).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sftpgo
  template:
    metadata:
      labels:
        app: sftpgo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      affinity:
        nodeAffinity:
          # hades-01 is memory-starved (k3s-config/README.md); hades-02 has more headroom.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [hades-02]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sftpgo
          image: docker.io/drakkan/sftpgo:v2.7.6-slim@sha256:fd1f7e2d5b8809e9856f74a2ec336b7a1bf38cd44f8334a3aa72bb5b55cccf43
          args: ["sftpgo", "serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # HTTP only: SFTP listener off (port 0); FTP and WebDAV have no bindings by default.
            - {name: SFTPGO_SFTPD__BINDINGS__0__PORT, value: "0"}
            - {name: SFTPGO_DATA_PROVIDER__DRIVER, value: sqlite}
            - {name: SFTPGO_DATA_PROVIDER__NAME, value: /var/lib/sftpgo/sftpgo.db}
            # First admin from SFTPGO_DEFAULT_ADMIN_USERNAME/_PASSWORD (secret) instead of the open setup page.
            - {name: SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN, value: "true"}
            # The owner user (S3 filesystem) comes from the secret; mode 0 re-applies it on every start (key rotation).
            - {name: SFTPGO_LOADDATA_FROM, value: /etc/sftpgo-init/initial-data.json}
            - {name: SFTPGO_LOADDATA_MODE, value: "0"}
            - {name: SFTPGO_COMMON__DEFENDER__ENABLED, value: "true"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__PORT, value: "8080"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN, value: "true"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT, value: "true"}
            # Behind Traefik (pod CIDR, node IPs on the tailnet and the home LAN) take the client IP from X-Forwarded-For.
            - {name: SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED, value: "XXX.XXX.XXX.XXX/16,XXX.XXX.XXX.XXX/10,XXX.XXX.XXX.XXX/16"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER, value: X-Forwarded-For}
            # Disabled login methods (bitmask): 8 web client password form + 32 user token endpoint + 128 user API keys.
            # The owner signs in to the web client with Authelia; the admin form stays (the admin UI is tailnet-only at the proxy).
            - {name: SFTPGO_HTTPD__BINDINGS__0__DISABLED_LOGIN_METHODS, value: "168"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL, value: "https://identity.vmd1.homelab"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID, value: sftpgo}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL, value: "https://files.vmd1.homelab"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD, value: preferred_username}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__SCOPES, value: "openid,profile,email"}
          # SFTPGO_DEFAULT_ADMIN_USERNAME, SFTPGO_DEFAULT_ADMIN_PASSWORD, SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET
          envFrom:
            - secretRef:
                name: sftpgo-secrets
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/sftpgo, subPath: var}
            - {name: data, mountPath: /srv/sftpgo, subPath: srv}
            - {name: init, mountPath: /etc/sftpgo-init, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: sftpgo-pvc
        - name: init
          secret:
            secretName: sftpgo-secrets
            items:
              - {key: initial-data.json, path: initial-data.json}
---
apiVersion: v1
kind: Service
metadata:
  name: sftpgo
  namespace: sftpgo
  labels:
    app: sftpgo
spec:
  selector:
    app: sftpgo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
