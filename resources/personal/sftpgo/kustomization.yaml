apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-egress-public

patches:
  # Egress: Backblaze B2 (S3) and the OIDC discovery/token calls to identity.vmd1.homelab, both on the internet.
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: sftpgo}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 8080}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 8080}
  # Admission hardening (policies/admission): app label (uid, seccomp and caps are set in the pod spec).
  - target: {kind: Deployment, name: sftpgo}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: sftpgo}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: sftpgo}
