# Retained on purpose: obsidian-sync was removed on 2026-11-09 but its CouchDB volume is kept
# until the notes are confirmed safe on the clients. Delete this file (Flux then prunes the
# volume) or `kubectl delete pvc -n obsidian obsidian-pvc` when no longer needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-pvc
  namespace: obsidian
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 10Gi
