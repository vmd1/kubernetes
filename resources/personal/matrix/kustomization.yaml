apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  # federation and the bridged services on the internet; the bridges and homeserver talk inside the namespace
  - ../../policies/components/netpol-egress-public

patches:
  # Components carry no namespace; the ports Traefik routes to (and the kubelet probes) replace the closed placeholder.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: matrix}
  # Each component's private vars ConfigMap (a replacement source, never rendered on its own) also needs the namespace, so two
  # enrolled apps in one Flux group do not collide on its name.
  - target: {kind: ConfigMap, name: "cluster-ranges-.*"}
    patch: |-
      - {op: add, path: /metadata/namespace, value: matrix}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports, value: [{protocol: TCP, port: 8008}, {protocol: TCP, port: 80}, {protocol: TCP, port: 29318}, {protocol: TCP, port: 29320}, {protocol: TCP, port: 29334}, {protocol: TCP, port: 29336}, {protocol: TCP, port: 29341}]}
