apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-db-client
  - ../../policies/components/netpol-egress-public

patches:
  # Postgres, Redis, Backblaze B2, the app store and Collabora's callbacks to the public URL. 9980 is Collabora behind its own route (kubelet probes use it too).
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: nextcloud}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 80}
      - {op: add, path: /spec/ingress/0/ports/-, value: {protocol: TCP, port: 9980}}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 80}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: collabora}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: collabora}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: collabora}
  - target: {kind: Deployment, name: nextcloud}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: nextcloud}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: nextcloud}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: nextcloud, securityContext: {allowPrivilegeEscalation: false}}
              - {name: nextcloud-cron, securityContext: {allowPrivilegeEscalation: false}}
