apiVersion: network.vmd1.homelab/v1alpha1
kind: FirewallRule
metadata:
  name: dns
spec:
  type: OCI
  description: DNS (PowerDNS on the ingress nodes) and DNS over TLS (dnsdist)
  nodeSelector:
    node-role.kubernetes.io/ingress: "true"
  ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
    - port: 853
      protocol: TCP
