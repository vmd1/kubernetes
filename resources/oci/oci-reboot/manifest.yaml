apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-reboot-controller
  namespace: oci-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oci-reboot-controller-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oci-reboot-controller-binding
subjects:
  - kind: ServiceAccount
    name: oci-reboot-controller
    namespace: oci-controller
roleRef:
  kind: ClusterRole
  name: oci-reboot-controller-role
  apiGroup: rbac.authorization.k8s.io
---
# Grant the controller read access to secrets in its own namespace (for per-account credentials)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oci-reboot-secret-reader
  namespace: oci-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-reboot-secret-reader-binding
  namespace: oci-controller
subjects:
  - kind: ServiceAccount
    name: oci-reboot-controller
    namespace: oci-controller
roleRef:
  kind: Role
  name: oci-reboot-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-reboot-controller
  namespace: oci-controller
  labels:
    app: oci-reboot-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-reboot-controller
  template:
    metadata:
      labels:
        app: oci-reboot-controller
    spec:
      serviceAccountName: oci-reboot-controller
      containers:
        - name: controller
          image: ghcr.io/vmd1/oci-reboot-controller:latest@sha256:bfa3e4ecc946fb5c234bc1e0a697500e37e979881948dc3d3f939066bdc6c442
          imagePullPolicy: IfNotPresent
          env:
            - name: MALLOC_TRIM_THRESHOLD_
              value: "100000"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLL_INTERVAL
              value: "15"
            # The 1 GB ingress nodes take up to 7 to 9 minutes after a boot to stall and recover on their own
            # (page-cache thrash while k3s, promtail, tailscaled and containerd start). A reset after 180 s
            # restarted that burst before the node could settle, which kept zeus-01 in a reset loop.
            - name: NOT_READY_THRESHOLD
              value: "600"
            # A freshly reset node gets this long before it can be reset again.
            - name: COOLDOWN_SECONDS
              value: "1200"
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
