# LDAP into lldap, only from the namespaces that authenticate against it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-ldap
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [authelia, registry]}
      ports:
        - {protocol: TCP, port: 3890}
