# Pull-through image cache for docker.io (Phase R1 of docs/edge-node-roadmap.md): Zot in on-demand sync mode.
# Docker Hub content is served at the registry ROOT (library/nginx, grafana/grafana, ...), which is what
# `nodectl registry <node> set --mirror https://<cache>` and a containerd mirror endpoint expect.
# Clients are read-only (anonymous read, no create/update/delete for anyone); only the sync extension writes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: registry-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache
  namespace: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-cache
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          # Multi-arch index (linux/amd64 + linux/arm64): runs on hades-01 (arm64) and hades-02 (amd64).
          image: ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
              name: http
          env:
            # Keep the Go heap well under the container limit so GC and sync bursts do not OOM-kill it.
            - name: GOMEMLIMIT
              value: 192MiB
            - name: GOGC
              value: "50"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/zot
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
        - name: config
          configMap:
            name: zot-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-cache
  namespace: registry-cache
  labels:
    app.kubernetes.io/name: registry-cache
spec:
  selector:
    app.kubernetes.io/name: registry-cache
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
