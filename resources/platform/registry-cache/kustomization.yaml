apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - tailscale.yaml

# The hash suffix on the ConfigMap name rolls the pod whenever config.json changes (Zot only reads it at start).
configMapGenerator:
  - name: zot-config
    namespace: registry-cache
    files:
      - config.json
