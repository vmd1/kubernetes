# Every Namespace in the cluster except flux-system (flux-system/gotk-components.yaml, labelled by a patch in
# flux-system/kustomization.yaml). Applied by the namespaces Flux Kustomization before every other layer.
# prune: disabled so removing a namespace from this file never deletes it and everything in it;
# delete a namespace by hand once its workloads are gone.
# The k3s built-ins (default, kube-*) are listed for their labels only; k3s creates them.
# vmd1.homelab/tier (app|infra|system) drives the admission policies in resources/policies/ and the netpol
# components. policy.vmd1.homelab/allow-* are namespace-level exemptions, owned here in Git, never on a pod.
# vmd1.homelab/db-server=true marks the namespaces that hold databases (cnpg, redis); the netpol-db-client component
# selects them. Client namespaces get vmd1.homelab/db-client=true when they are enrolled in the netpol rollout.
---
apiVersion: v1
kind: Namespace
metadata:
  name: authelia
  labels:
    pod-security.kubernetes.io/audit: "restricted"
    pod-security.kubernetes.io/warn: "restricted"
    vmd1.homelab/tier: "infra"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
