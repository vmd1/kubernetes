apiVersion: v1
kind: Node
metadata:
  name: hades-01
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    longhorn: "true"
    node-role.kubernetes.io/db: "true"
    node-role.kubernetes.io/storage: "true"
    node-type: "controlplane"
    node.longhorn.io/create-default-disk: "true"
    storage.vmd1.homelab/cnpg: "true"
    storage.vmd1.homelab/longhorn-client: "true"
    storage.vmd1.homelab/redis-sentinel: "true"
    storage.vmd1.homelab/redis-server: "true"
    topology.kubernetes.io/region: "united-kingdom"
    topology.kubernetes.io/zone: "uk-home"
