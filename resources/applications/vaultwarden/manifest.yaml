apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/region
              labelSelector:
                matchLabels:
                  app: vaultwarden
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: DOMAIN
              value: "https://vault.vmd1.homelab"
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: WEBSOCKET_ENABLED
              value: "true"
            # /data is a per-pod emptyDir, so attachments would only exist on one replica.
            # A limit of 0 KB disables attachment uploads for users and organisations.
            - name: USER_ATTACHMENT_LIMIT
              value: "0"
            - name: ORG_ATTACHMENT_LIMIT
              value: "0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
            - name: vaultwarden-config
              mountPath: /data/config.json
              subPath: config.json
            - name: vaultwarden-keys
              mountPath: /data/rsa_key.pem
              subPath: rsa_key.pem
      volumes:
        - name: vaultwarden-data
          emptyDir: {}
        - name: vaultwarden-config
          configMap:
            name: vaultwarden-config
        - name: vaultwarden-keys
          secret:
            secretName: vaultwarden-keys
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  # Prefer endpoints in the caller's zone (kube-proxy); falls back to any endpoint if none is local.
  trafficDistribution: PreferClose
  selector:
    app: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
