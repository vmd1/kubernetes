apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-operator
  namespace: vmd1-web
  labels:
    app: edge-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge-operator
  template:
    metadata:
      labels:
        app: edge-operator
    spec:
      serviceAccountName: edge-operator
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      containers:
        - name: operator
          image: ghcr.io/vmd1/edge-operator:latest
          imagePullPolicy: Always
          env:
            - name: BUILDER_IMAGE
              value: ghcr.io/vmd1/edge-builder:latest
            - name: RUNTIME_IMAGE
              value: ghcr.io/vmd1/edge-runtime:latest
            - name: REGISTRY_INTERNAL
              value: registry.registry.svc.cluster.local:5000
            - name: REGISTRY_PUBLIC
              value: registry.vmd1.homelab
            - name: EDGE_REPO_ALLOWLIST
              value: '^https://github\.com/vmd1/'
            - name: MAX_CONCURRENT_JOBS
              value: "1"
            - name: EDGE_FAST_PATH
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 320Mi
      volumes:
        # scratch space for fast-path clones and layer packing
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
