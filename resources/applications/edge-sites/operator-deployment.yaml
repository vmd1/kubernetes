apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-operator
  namespace: vmd1-web
  labels:
    app: edge-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge-operator
  template:
    metadata:
      labels:
        app: edge-operator
    spec:
      serviceAccountName: edge-operator
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      containers:
        - name: operator
          image: ghcr.io/vmd1/edge-operator:latest@sha256:20a9c41af3989b39feddb923c410d6ab243105fdf588d3eaeb7a59302481a5cd
          imagePullPolicy: IfNotPresent
          env:
            - name: BUILDER_IMAGE
              value: ghcr.io/vmd1/edge-builder:latest@sha256:0d353f215003c241ac913c90c4a60f62c1b21ed22accc8973517f1bcceacb1b2
            - name: RUNTIME_IMAGE
              value: ghcr.io/vmd1/edge-runtime:latest@sha256:4f8ae46bf6733d479b624c07a7eb48f3ef60a3e88bdb847a9fb3df98062b62cb
            # The one registry for builds (Kaniko, fast path) and for the edge pods' pulls (token auth).
            - name: REGISTRY_HOST
              value: registry.vmd1.homelab
            - name: REGISTRY_URL
              value: https://registry.vmd1.homelab
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef: {name: edge-registry-creds, key: username}
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef: {name: edge-registry-creds, key: password}
            - name: EDGE_REPO_ALLOWLIST
              value: '^https://github\.com/vmd1/'
            - name: MAX_CONCURRENT_JOBS
              value: "1"
            - name: EDGE_FAST_PATH
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 320Mi
      volumes:
        # scratch space for fast-path clones and layer packing
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
