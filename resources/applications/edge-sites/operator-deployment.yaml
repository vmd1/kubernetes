apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-operator
  namespace: vmd1-web
  labels:
    app: edge-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge-operator
  template:
    metadata:
      labels:
        app: edge-operator
    spec:
      serviceAccountName: edge-operator
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      containers:
        - name: operator
          image: ghcr.io/vmd1/edge-operator:latest
          imagePullPolicy: Always
          env:
            - name: BUILDER_IMAGE
              value: ghcr.io/vmd1/edge-builder:latest
            - name: RUNTIME_IMAGE
              value: ghcr.io/vmd1/edge-runtime:latest
            # The one registry for builds (Kaniko, fast path) and for the edge pods' pulls (token auth).
            - name: REGISTRY_HOST
              value: registry.vmd1.homelab
            - name: REGISTRY_URL
              value: https://registry.vmd1.homelab
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef: {name: edge-registry-creds, key: username}
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef: {name: edge-registry-creds, key: password}
            - name: EDGE_REPO_ALLOWLIST
              value: '^https://github\.com/vmd1/'
            - name: MAX_CONCURRENT_JOBS
              value: "1"
            - name: EDGE_FAST_PATH
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 320Mi
      volumes:
        # scratch space for fast-path clones and layer packing
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
