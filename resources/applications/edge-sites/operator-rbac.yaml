apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-operator
  namespace: vmd1-web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-operator
  namespace: vmd1-web
rules:
  - apiGroups: ["edge.vmd1.homelab"]
    resources: ["edgesites", "edgesites/status", "edgesites/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-operator
  namespace: vmd1-web
subjects:
  - kind: ServiceAccount
    name: edge-operator
    namespace: vmd1-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edge-operator
