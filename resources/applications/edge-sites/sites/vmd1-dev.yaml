# The vmd1.homelab Hugo site (vmd1/vmd1.homelab). The serve config is NOT inline: it lives in the repo's edge-serve.yml
# (the fallback source of the serve config), so the site's config changes with the site.
apiVersion: edge.vmd1.homelab/v1alpha1
kind: EdgeSite
metadata:
  name: vmd1-dev
  namespace: vmd1-web
spec:
  domain: vmd1.homelab
  repo: https://github.com/vmd1/vmd1.homelab
  branch: main
  auth:
    paths: ["/white-hat"]   # Authelia login for vmd1.homelab/white-hat/*
