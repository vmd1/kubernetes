# =============================================================================
# Matrix Stack - K3s Manifest
# Migrated from compose/ultimate/matrix + compose/ultimate/matrix-pub
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: matrix
---
# =============================================================================
# CONFIGMAP: continuwuity (main, vmd1.homelab)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: continuwuity-config
  namespace: matrix
data:
  CONTINUWUITY_SERVER_NAME: "vmd1.homelab"
  CONTINUWUITY_DATABASE_PATH: "/var/lib/continuwuity"
  CONTINUWUITY_PORT: "8008"
  CONTINUWUITY_ADDRESS: "0.0.0.0"
  CONTINUWUITY_ALLOW_REGISTRATION: "false"
  CONTINUWUITY_MAX_REQUEST_SIZE: "104857600"
  CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'
  CONTINUWUITY_ALLOW_LOCAL_PRESENCE: "false"
  CONTINUWUITY_ALLOW_INCOMING_PRESENCE: "false"
  CONTINUWUITY_ALLOW_OUTGOING_PRESENCE: "false"
---
# =============================================================================
# PVCs - LongHorn storage
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: continuwuity-data
  namespace: matrix
spec:
  storageClassName: longhorn-single-replica
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
# =============================================================================
# DEPLOYMENTS
# =============================================================================

# --- continuwuity (main, vmd1.homelab) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuwuity
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: continuwuity
  template:
    metadata:
      labels:
        app: continuwuity
    spec:
      automountServiceAccountToken: false
      containers:
        - name: continuwuity
          image: forgejo.ellis.link/continuwuation/continuwuity:latest-maxperf@sha256:14689dfb874405bd72e3b84bf5d394d2ab6a1bb959ff9d458af0ca5a373dafed
          command: ["/sbin/conduwuit"]
          envFrom:
            - configMapRef:
                name: continuwuity-config
          ports:
            - containerPort: 8008
          resources:
            limits:
              cpu: "1000m"
              memory: 1024Mi
            requests:
              cpu: "50m"
              memory: 600Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/continuwuity
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - hades-02
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: continuwuity-data
---
# --- mautrix-whatsapp ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautrix-whatsapp
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mautrix-whatsapp
  template:
    metadata:
      labels:
        app: mautrix-whatsapp
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mautrix-whatsapp
      containers:
        - name: bridge
          image: dock.mau.dev/mautrix/whatsapp:latest@sha256:95cb382e0def52750b193401515d7df06278b99083dd5337b5ba401f27a8b26f
          ports:
            - containerPort: 29318
          resources:
            limits:
              cpu: "100m"
              memory: 128Mi
            requests:
              cpu: "10m"
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /data/registration.yaml
              subPath: registration.yaml
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: mautrix-whatsapp-config
