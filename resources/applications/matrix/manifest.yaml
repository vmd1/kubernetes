# =============================================================================
# CONFIGMAP: fluffychat (vmd1.homelab)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluffychat-config
  namespace: matrix
data:
  config.json: |
    {
      "default_homeserver": "vmd1.homelab",
      "homeserver_list": [
        "vmd1.homelab",
        "matrix.vmd1.homelab",
        "beeper.com",
        "vmd1.homelab"
      ],
      "disable_custom_homeservers": true,
      "app_name": "vmd1"
    }
---
# =============================================================================
# DEPLOYMENT: fluffychat
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluffychat
  namespace: matrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluffychat
  template:
    metadata:
      labels:
        app: fluffychat
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fluffychat
          matchLabelKeys:
            - pod-template-hash
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node-role"
          operator: "Equal"
          value: "ingress"
          effect: "NoSchedule"
      containers:
        - name: fluffychat
          image: ghcr.io/krille-chan/fluffychat:latest@sha256:52a9201d7397dd3e888f3a7986b8ef0fb9a49033b89a2dbd38f662869c138b12
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "100m"
              memory: 64Mi
            requests:
              cpu: "10m"
              memory: 32Mi
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/assets/config.json
              subPath: config.json
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
      volumes:
        - name: config-volume
          configMap:
            name: fluffychat-config
---
# =============================================================================
# SERVICE: fluffychat
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: fluffychat
  namespace: matrix
spec:
  selector:
    app: fluffychat
  ports:
    - port: 80
      targetPort: 80
