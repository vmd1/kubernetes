apiVersion: v1
kind: Namespace
metadata:
  name: bookorbit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-data-pvc
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-books-pvc
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: bookorbit
  labels:
    app: bookorbit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookorbit
  template:
    metadata:
      labels:
        app: bookorbit
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: APP_PORT
              value: "3000"
            - name: APP_URL
              value: "https://read.vmd1.homelab"
            - name: CLIENT_URL
              value: "https://read.vmd1.homelab"
            - name: POSTGRES_HOST
              value: "pg-cluster-rw.cnpg.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "bookorbit"
            - name: POSTGRES_USER
              value: "bookorbit"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: BOOKORBIT_FIX_PERMISSIONS
              value: "true"
            - name: LIBRARY_BROWSE_ROOT
              value: "/books"
            - name: NODE_MAX_OLD_SPACE_SIZE
              value: "2048"
          envFrom:
            - secretRef:
                name: bookorbit-secrets
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: bookorbit-data
              mountPath: /data
            - name: bookorbit-books
              mountPath: /books
      volumes:
        - name: bookorbit-data
          persistentVolumeClaim:
            claimName: bookorbit-data-pvc
        - name: bookorbit-books
          persistentVolumeClaim:
            claimName: bookorbit-books-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bookorbit
  namespace: bookorbit
  labels:
    app: bookorbit
spec:
  selector:
    app: bookorbit
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
