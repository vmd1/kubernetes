apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-pvc
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: MALLOC_TRIM_THRESHOLD_
              value: "100000"
            - name: TZ
              value: "Europe/London"
          resources:
            requests:
              cpu: 100m
              memory: 950Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: config-volume
              mountPath: /config
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:stable
          securityContext:
            runAsUser: 0
          env:
            - name: STORAGE_PATH
              value: "/data"
          ports:
            - name: matter-ws
              containerPort: 5580
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              subPath: matter-server-data
              mountPath: /data
        - name: filebrowser
          image: filebrowser/filebrowser:v2
          securityContext:
            runAsUser: 0
          args:
            - --database=/config/filebrowser.db
            - --root=/config
            - --noauth
            - --port=8082
          ports:
            - name: filebrowser
              containerPort: 8082
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: home-assistant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
  annotations:
    kube-vip.io/loadbalancerIPs: "192.168.12.11"
spec:
  type: LoadBalancer
  loadBalancerClass: kube-vip.io/kube-vip-class
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: matter-ws
      port: 5580
      targetPort: 5580
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-filebrowser
  namespace: home-assistant
  labels:
    app: home-assistant-filebrowser
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 80
      targetPort: 8082
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: home-assistant
  labels:
    app: matter-server
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 5580
      targetPort: 5580
      protocol: TCP
