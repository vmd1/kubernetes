apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-region-controller
  namespace: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailscale-region-controller-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["tailscale.com"]
    resources: ["connectors", "proxyclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-region-controller-binding
subjects:
  - kind: ServiceAccount
    name: tailscale-region-controller
    namespace: tailscale
roleRef:
  kind: ClusterRole
  name: tailscale-region-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-region-controller
  namespace: tailscale
  labels:
    app: tailscale-region-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-region-controller
  template:
    metadata:
      labels:
        app: tailscale-region-controller
    spec:
      serviceAccountName: tailscale-region-controller
      containers:
        - name: controller
          image: ghcr.io/vmd1/tailscale-region-controller:latest@sha256:0893aca045443667afee2bc9121a5a3de883be0fff59d3767848b8c3d2024a17
          imagePullPolicy: IfNotPresent
          env:
            - name: MALLOC_TRIM_THRESHOLD_
              value: "100000"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RECONCILE_INTERVAL
              value: "30"
            - name: TAILSCALE_MTU
              value: "1130"
            - name: REGION_GRACE_PERIOD
              value: "604800"  # 1 week
            - name: FAILOVER_GRACE_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
