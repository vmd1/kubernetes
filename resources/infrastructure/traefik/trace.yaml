# GET https://<any domain>/.vmd1/trace -> plain-text connection info (answered by the vmd1trace
# local plugin, see crds-and-operators/traefik/manifest.yaml). resp-reg is looked up by node name.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vmd1-trace
  namespace: traefik
spec:
  plugin:
    vmd1trace:
      regions:
        hades-01: uk-home
        hades-02: uk-home
        zeus-01: uk-london-cloud
        zeus-02: uk-london-cloud
        ares-01: in-mumbai-cloud
        ares-02: in-mumbai-cloud
        hera-01: fr-marseille-cloud
        hera-02: fr-marseille-cloud
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vmd1-trace
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    # No Host() on purpose: matches every domain. The priority keeps it above every site route.
    - match: Path(`/.vmd1/trace`)
      kind: Rule
      priority: 1000000
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: rate-limit
        - name: vmd1-trace
