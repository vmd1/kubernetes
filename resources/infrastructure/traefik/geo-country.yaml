# Makes the CF-IPCountry request header trustworthy on every route (plugin vmd1geo, defined in the HelmChart values of
# operators/traefik). Requests from Cloudflare keep the (validated) country Cloudflare set; direct requests
# get the header from a GeoLite2-Country lookup of the client address, in Cloudflare's format (ISO 3166-1 alpha-2, "XX"
# when unknown), and X-Vmd1-Geo-Source says which ("cloudflare", "geoip" or "none"). Whatever the client sent is
# discarded. The database is /var/lib/geoip/GeoLite2-Country.mmdb on the node, kept fresh by the geoip-updater and
# re-read by the plugin when the file changes. Fails open: no database only means "XX".
#
# NOT attached to any entrypoint or route yet: the entrypoint argument is added in a separate change, after this
# Middleware and the plugin are live, because an entrypoint middleware that does not exist breaks routing.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: geo-country
  namespace: traefik
spec:
  plugin:
    vmd1geo:
      dbPath: /geoip/GeoLite2-Country.mmdb
