# sniStrict stays false on purpose: a client without a matching SNI (bare IP, unknown host) must complete the
# handshake with the default wildcard cert so it can be shown the "direct IP access forbidden" page (error-pages.yaml).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS12
  # TLS 1.2 suites: ECDHE + AEAD only (TLS 1.3 suites are not configurable and always on)
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  curvePreferences:
    - X25519
    - CurveP256
    - CurveP384
  sniStrict: false
