apiVersion: v1
kind: Namespace
metadata:
  name: lldap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
  labels:
    app: lldap
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: lldap
  template:
    metadata:
      labels:
        app: lldap
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubernetes.io/zone: uk-home
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: lldap
          matchLabelKeys:
            - pod-template-hash
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - lldap
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      containers:
        - name: lldap
          image: lldap/lldap:latest
          ports:
            - name: ldap
              containerPort: 3890
              protocol: TCP
            - name: ldaps
              containerPort: 6360
              protocol: TCP
            - name: http
              containerPort: 17170
              protocol: TCP
          env:
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: TZ
              value: "Europe/London"
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: LLDAP_JWT_SECRET
            - name: LLDAP_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: LLDAP_KEY_SEED
            - name: LLDAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: LLDAP_DATABASE_URL
            - name: LLDAP_LDAP_BASE_DN
              value: "dc=kmnet,dc=uk"
            - name: LLDAP_LDAPS_OPTIONS__ENABLED
              value: "true"
            - name: LLDAP_LDAPS_OPTIONS__CERT_FILE
              value: "/certs/cert.pem"
            - name: LLDAP_LDAPS_OPTIONS__KEY_FILE
              value: "/certs/key.pem"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: certs-volume
              mountPath: /certs
              readOnly: true
      volumes:
        - name: data-volume
          emptyDir: {}
        - name: certs-volume
          secret:
            secretName: lldap-certs
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
  labels:
    app: lldap
spec:
  selector:
    app: lldap
  ports:
    - name: http
      port: 17170
      targetPort: 17170
      protocol: TCP
    - name: ldap
      port: 3890
      targetPort: 3890
      protocol: TCP
    - name: ldaps
      port: 6360
      targetPort: 6360
      protocol: TCP
