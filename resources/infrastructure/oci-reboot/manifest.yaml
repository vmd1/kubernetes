apiVersion: v1
kind: Namespace
metadata:
  name: oci-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-reboot-controller
  namespace: oci-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oci-reboot-controller-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oci-reboot-controller-binding
subjects:
  - kind: ServiceAccount
    name: oci-reboot-controller
    namespace: oci-controller
roleRef:
  kind: ClusterRole
  name: oci-reboot-controller-role
  apiGroup: rbac.authorization.k8s.io
---
# Grant the controller read access to secrets in its own namespace (for per-account credentials)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oci-reboot-secret-reader
  namespace: oci-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-reboot-secret-reader-binding
  namespace: oci-controller
subjects:
  - kind: ServiceAccount
    name: oci-reboot-controller
    namespace: oci-controller
roleRef:
  kind: Role
  name: oci-reboot-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-reboot-controller
  namespace: oci-controller
  labels:
    app: oci-reboot-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-reboot-controller
  template:
    metadata:
      labels:
        app: oci-reboot-controller
    spec:
      serviceAccountName: oci-reboot-controller
      containers:
        - name: controller
          image: ghcr.io/vmd1/oci-reboot-controller:latest@sha256:eb4dc987988e752a86df0fdfcd668c8242f4673847a95528ed1d05c90933e3dd
          imagePullPolicy: IfNotPresent
          env:
            - name: MALLOC_TRIM_THRESHOLD_
              value: "100000"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLL_INTERVAL
              value: "15"
            - name: NOT_READY_THRESHOLD
              value: "180"
            - name: COOLDOWN_SECONDS
              value: "300"
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
