# systemd drop-in for k3s.service on hades-01 (control plane).
# Installed as /etc/systemd/system/k3s.service.d/20-memory-protect.conf by _scripts/apply-k3s-config.sh.
#
# Why: hades-01 has 8 GB and runs about 5.2 GB of workload pods next to k3s, so the kernel is always reclaiming.
# With no protection, k3s pages (binary, etcd and apiserver heap) are swapped out and refaulted like any pod's,
# which is what turns a memory squeeze into slow etcd fdatasync (1-2 s) and lease renewal timeouts.
# MemoryLow asks the kernel to reclaim from everything else first; it is a soft guarantee, not a hard reservation.
# OOMScoreAdjust keeps the OOM killer off k3s (containerd shims run outside this cgroup: KillMode=process).
[Service]
MemoryLow=2G
OOMScoreAdjust=-900
