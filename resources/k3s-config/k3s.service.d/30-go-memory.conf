# systemd drop-in for k3s.service on hades-01 (control plane).
# Installed as /etc/systemd/system/k3s.service.d/30-go-memory.conf by _scripts/apply-k3s-config.sh.
#
# Why: the k3s binary is one Go process (apiserver, etcd, controllers, kubelet, kube-router) with GOGC=100 and no
# memory limit. On 2026-11-12 the live heap was 706 MB but the runtime held go_memstats_heap_inuse 1.5 GB (next GC
# at 1.67 GB, heap_sys 2.08 GB), because with GOGC=100 the heap is allowed to double before a collection. The
# previous run peaked at 2.6 GB RSS plus 1.7 GB swap, which is what the node cannot afford while it is also
# running 68 pods.
# GOMEMLIMIT is a soft ceiling: the collector works harder as the heap approaches it. 3072 MiB is about four times
# the steady live heap. It was 1536 MiB until 2026-11-13, which broke during the DiskPressure pod storm: 12,000
# Failed pod objects pushed the live heap past 1.5 GiB, the collector ran continuously (GC was more than half of
# k3s's 3.4 cores) and pod cleanup crawled at 3 per second. The limit only clamps runaway peaks; it must sit well
# above any live heap the cluster can reach. Do not set it near
# the live heap: below roughly 1.1x live the runtime spends up to half a core in GC (it is capped at 50%).
[Service]
Environment=GOMEMLIMIT=3072MiB
