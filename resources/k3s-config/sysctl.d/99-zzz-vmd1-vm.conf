# Installed as /etc/sysctl.d/99-zzz-vmd1-vm.conf on hades-01 by _scripts/apply-k3s-config.sh.
#
# Why: hades-01 has two files that set the same key, /etc/sysctl.d/99-swappiness.conf (10) and
# /etc/sysctl.d/99-zram.conf (100). They load alphabetically, so 100 won by accident. This file sorts after both
# (the 99-zzz prefix) so the value is a deliberate one. 60 is the kernel default: with zram swap an anonymous
# page costs a compression, not a disk seek, so a high value is defensible, but at 100 the kernel reclaims
# anonymous and file pages at equal pressure, and the file pages left (the k3s binary, etcd's mmap'd bbolt file)
# are the ones the control plane needs resident. This is hygiene, not the fix: with demand above RAM no
# swappiness value helps (see ../README.md). Delete the two old files by hand once this is installed.
# page-cluster=0 is already the running value; it is pinned so the zram read-ahead stays off (a cluster of 8
# multiplies swap-in work for random access).
vm.swappiness = 60
vm.page-cluster = 0
