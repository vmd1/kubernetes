apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml

patches:
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: home-assistant}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: home-assistant}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: home-assistant}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
