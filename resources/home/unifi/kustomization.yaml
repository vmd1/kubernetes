apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

patches:
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: unifi}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: unifi}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: unifi}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: unifi, securityContext: {allowPrivilegeEscalation: false}}
  - target: {kind: Deployment, name: unifi-db}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: unifi-db}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: unifi-db}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: mongo, securityContext: {allowPrivilegeEscalation: false}}
