apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml

patches:
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: mosquitto}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mosquitto}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: mosquitto}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: mosquitto, securityContext: {allowPrivilegeEscalation: false}}
