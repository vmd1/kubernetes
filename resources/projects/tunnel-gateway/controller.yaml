# The TunnelAgent controller (controller/controller.py): issues each agent's credentials into Secret agent-<name> and renders
# the gateway's wstunnel restrictions into Secret tunnel-gateway-restrictions. Code is a ConfigMap on a pinned stock image
# (no image to build), stdlib only, same pattern as the Blocklist controller in edge/dns-resolver.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunnel-controller
  namespace: tunnel-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tunnel-controller
  namespace: tunnel-gateway
rules:
  - apiGroups: [tunnel.vmd1.homelab]
    resources: [tunnelagents]
    verbs: [list]
  - apiGroups: [tunnel.vmd1.homelab]
    resources: [tunnelagents/status]
    verbs: [patch]
  # Connection times (status.lastSeen / connectionType) come from the gateway pods' own logs, read-only and only those pods.
  - apiGroups: [""]
    resources: [pods/log]
    resourceNames: [tunnel-gateway-0, tunnel-gateway-1]
    verbs: [get]
  # Namespace-scoped: its own credentials and the rendered restrictions. (Create cannot be limited by name.)
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tunnel-controller
  namespace: tunnel-gateway
subjects:
  - {kind: ServiceAccount, name: tunnel-controller, namespace: tunnel-gateway}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tunnel-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-controller
  namespace: tunnel-gateway
  labels:
    app.kubernetes.io/name: tunnel-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tunnel-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunnel-controller
    spec:
      serviceAccountName: tunnel-controller
      enableServiceLinks: false
      # Never on the small edge nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/ingress, operator: DoesNotExist}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: [python3, -u, /code/controller.py]
          ports:
            - {name: enroll, containerPort: 8080}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            # Gateway replicas and their hostnames, each under three domains for failover (DNS: dns/domains/*.js, ingressroute.yaml).
            # Must match manifest.yaml replicas.
            - {name: GATEWAYS, value: "2"}
            - {name: GATEWAY_HOST, value: "coordination-{i}.vmd1.homelab,coordination-{i}.vmd1.homelab,coordination-{i}.vmd1.homelab"}
            - {name: VIA_URL, value: "wss://coordination.vmd1.homelab,wss://coordination.vmd1.homelab,wss://coordination.vmd1.homelab"}
            # Lab bridges (spec.bridge): pods in tunnel-bridge, direct UDP on NodePort BRIDGE_PORT_BASE + slot (oci/firewall/tunnel-bridge.yaml
            # opens the same BRIDGE_SLOTS ports on the ingress nodes), endpoints on the coordination.<domain> names (not Cloudflare: no UDP).
            # Enrollment (POST /enroll on the coordination names, ingressroute.yaml): a 3-use token for the whole agent.env. The shared bits
            # (TS_AUTHKEY, CANARY) are in Secret tunnel-enroll-common, created by hand (kubectl), never committed.
            - {name: ENROLL_PORT, value: "8080"}
            - {name: BRIDGE_NAMESPACE, value: "tunnel-bridge"}
            - {name: BRIDGE_IMAGE, value: "ghcr.io/vmd1/tunnel-bridge:latest"}
            - {name: BRIDGE_PORT_BASE, value: "31820"}
            - {name: BRIDGE_SLOTS, value: "16"}
            # vmd1.homelab resolves to the uk-home WAN IP (dns/domains/vmd1.homelab.js) and the router forwards UDP 31820-31835 to a lab node, so direct UDP
            # enters at the lab first (measured about twice the throughput of going through an edge node); the edge domains are the fallback.
            - {name: BRIDGE_ENDPOINT_HOSTS, value: "coordination.vmd1.homelab,coordination.vmd1.homelab,coordination.vmd1.homelab"}
            # WireGuard MTU on both ends: full-size packets (> ~1170) do not fit the 1230-byte pod MTU and are silently dropped.
            - {name: BRIDGE_MTU, value: "1100"}
            # What the fallback pathway's health check connects to FROM the gateway pod: the cluster DNS service (TCP).
            - {name: TUNNEL_CANARY, value: "XXX.XXX.XXX.XXX:53"}
          livenessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/heartbeat -mmin -2 2>/dev/null)"']
            initialDelaySeconds: 90
            periodSeconds: 60
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: code, mountPath: /code, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: tunnel-gateway-code}
        - name: tmp
          emptyDir: {sizeLimit: 8Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tunnel-enroll
  namespace: tunnel-gateway
spec:
  selector:
    app.kubernetes.io/name: tunnel-controller
  ports:
    - {name: http, port: 8080, targetPort: enroll}
