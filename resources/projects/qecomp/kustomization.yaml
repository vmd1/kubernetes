apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - ingressroute.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-egress-any

patches:
  # Reaches the local network and the internet by design (profile from the hardening plan); only ingress is restricted. Pod port 8000 (the Service maps 80 -> 8000).
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: qecomp}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 8000}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 8000}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: qecomp}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: qecomp}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: qecomp}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            automountServiceAccountToken: false
            containers:
              - {name: qecomp, securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}}
            initContainers:
              - {name: migrate, securityContext: {allowPrivilegeEscalation: false}}
