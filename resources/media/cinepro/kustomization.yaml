apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-db-client
  - ../../policies/components/netpol-egress-public

patches:
  # Redis and external APIs (api.vmd1.homelab and upstream sources).
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: cinepro}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 3000}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 3000}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: cinepro-core}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: cinepro-core}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: cinepro-core}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: cinepro-core, securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001}}
