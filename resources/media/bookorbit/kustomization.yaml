apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - ingressroute.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-db-client
  - ../../policies/components/netpol-egress-public

patches:
  # Postgres (CNPG) and book-metadata sites on the internet.
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: bookorbit}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 3000}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 3000}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: bookorbit}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: bookorbit}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: bookorbit}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: bookorbit, securityContext: {allowPrivilegeEscalation: false}}
