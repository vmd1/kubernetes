apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-egress-any

patches:
  # Probes every service, so egress stays open; only ingress is restricted. Pod port 3001 (the Service maps 80 -> 3001).
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: uptime-kuma}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 3001}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 3001}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: uptime-kuma}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: uptime-kuma}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: uptime-kuma}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: uptime-kuma, securityContext: {allowPrivilegeEscalation: false}}
