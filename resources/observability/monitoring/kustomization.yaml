apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - dashboards.yaml
  - podflow-dashboards.yaml
  - kube-state-metrics.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  # Prometheus scrapes every namespace, node and the API server; Grafana reaches Postgres and the OIDC provider
  - ../../policies/components/netpol-egress-any

patches:
  # Components carry no namespace; the ports Traefik routes to (and the kubelet or API server call) replace the closed placeholder.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: monitoring}
  # Each component's private vars ConfigMap (a replacement source, never rendered on its own) also needs the namespace, so two
  # enrolled apps in one Flux group do not collide on its name.
  - target: {kind: ConfigMap, name: "cluster-ranges-.*"}
    patch: |-
      - {op: add, path: /metadata/namespace, value: monitoring}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports, value: [{protocol: TCP, port: 3000}, {protocol: TCP, port: 8080}, {protocol: TCP, port: 8081}]}
