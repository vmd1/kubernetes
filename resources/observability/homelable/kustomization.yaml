apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - ingressroute.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-egress-any

patches:
  # Scans the network, so egress stays open. 80 is the frontend (Traefik), 8000 the backend (kubelet probe; the frontend reaches it inside the namespace).
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: homelable}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 80}
      - {op: add, path: /spec/ingress/0/ports/-, value: {protocol: TCP, port: 8000}}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 80}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: homelable-backend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: homelable-backend}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: homelable-backend}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: backend, securityContext: {allowPrivilegeEscalation: false}}
  - target: {kind: Deployment, name: homelable-frontend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: homelable-frontend}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: homelable-frontend}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: frontend, securityContext: {allowPrivilegeEscalation: false}}
