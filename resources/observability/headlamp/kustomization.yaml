apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml

components:
  - ../../policies/components/netpol-baseline
  # Headlamp (in-cluster mode) talks only to the Kubernetes API; no internet, no other pods.
  - ../../policies/components/netpol-api-server

patches:
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: headlamp}
  # Pod port 4466 (the Service maps 80 -> 4466); NetworkPolicy matches the pod port after DNAT.
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 4466}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 4466}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: headlamp}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: headlamp}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: headlamp}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: headlamp, securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 100}}
