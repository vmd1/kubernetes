apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  # Outbound SMTP relay (mail.smtp2go.com:587) and web-push delivery, see the README.
  - ../../policies/components/netpol-egress-public

patches:
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: ntfy}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 2586}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 2586}
