apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingressroute.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  # Outbound SMTP relay (mail.smtp2go.com:587) and web-push delivery, see the README.
  - ../../policies/components/netpol-egress-public

patches:
  # Components carry no namespace; the app port and scrape port replace the closed placeholder (port 1).
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: ntfy}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 2586}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 2586}
  # Admission hardening (policies/admission): app label, seccomp, no privilege escalation, runAsNonRoot where the image already runs as a fixed uid
  - target: {kind: Deployment, name: ntfy}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ntfy}
      spec:
        template:
          metadata:
            labels: {app.kubernetes.io/name: ntfy}
          spec:
            securityContext: {seccompProfile: {type: RuntimeDefault}}
            containers:
              - {name: ntfy, securityContext: {allowPrivilegeEscalation: false}}
