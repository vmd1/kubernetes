apiVersion: v1
kind: Namespace
metadata:
  name: cnpg

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
  namespace: cnpg
spec:
  instances: 2

  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
      work_mem: "4MB"

  env:
    - name: BARMAN_S3_USE_PATH_STYLE
      value: "true"

  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: pg-cluster-rw-lb
              annotations:
                kube-vip.io/loadbalancerIPs: "192.168.12.222"
            spec:
              type: LoadBalancer
              loadBalancerClass: kube-vip.io/kube-vip-class

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://homelab-cnpg/"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-secret
          key: SECRET_ACCESS_KEY
        region:
          name: cnpg-backup-secret
          key: REGION
      wal:
        compression: gzip

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Storage configuration
  storage:
    size: 10Gi
    storageClass: local-path

  # Database bootstrap settings
  bootstrap:
    initdb:
      database: app
      owner: app

  # Scheduling constraints
  affinity:
    # Restrict to nodes tagged storage.vmd1.homelab/cnpg=true
    nodeSelector:
      storage.vmd1.homelab/cnpg: "true"
    
    # Enforce at most 1 replica per node (hard anti-affinity)
    podAntiAffinityType: required

    # Tolerations to allow running on tainted ingress and control plane nodes
    tolerations:
      - key: "node-role"
        operator: "Equal"
        value: "ingress"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

