# Keeps the MaxMind GeoLite2 databases fresh on every node that serves traffic, for PowerDNS (City: it needs
# lat/lon for pickclosest), Traefik (Country: small enough to hold in the plugin) and podflow (Country + ASN). One updater per node writes
# to the shared hostPath /var/lib/geoip; consumers mount that directory read-only. geoipupdate asks MaxMind
# whether each edition changed (md5) and only downloads when it did, so the 12 hourly checks cost almost nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: geoip
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: geoip-updater
  namespace: geoip
  labels:
    app.kubernetes.io/name: geoip-updater
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: geoip-updater
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geoip-updater
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      containers:
        - name: geoipupdate
          image: ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
          # Pinned by the multi-arch index digest (amd64, arm64, arm/v6); the tag is kept for readability. To upgrade,
          # resolve the new tag's index digest (docker buildx imagetools inspect ghcr.io/maxmind/geoipupdate:<tag>) and replace both.
          # The image entrypoint exits (set -e) when geoipupdate fails, which
          # crash-loops the pod and blocks Flux whenever MaxMind rate-limits
          # (429). Run our own loop: a failed check keeps the existing
          # databases and is retried at the next interval.
          command:
            - /bin/sh
            - -c
            - |
              trap 'exit 0' TERM INT
              while true; do
                /usr/bin/geoipupdate || echo "geoipupdate failed; keeping existing databases"
                sleep "$((GEOIPUPDATE_FREQUENCY * 3600))" &
                wait $!
              done
          env:
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: maxmind-credentials
                  key: account-id
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: maxmind-credentials
                  key: license-key
            # GeoLite2 is released on Tuesdays and Fridays; the City edition is for PowerDNS, Country for Traefik
            # and podflow, ASN (network owner, ~10 MB) for podflow's flow classification.
            - name: GEOIPUPDATE_EDITION_IDS
              value: "GeoLite2-City GeoLite2-Country GeoLite2-ASN"
            - name: GEOIPUPDATE_FREQUENCY
              value: "24"
            # MaxMind caps downloads per account per day and answers 429 to
            # every request (even up-to-date checks) once it is hit, so do
            # not hammer it with retries.
            - name: GEOIPUPDATE_RETRY_FOR
              value: "0s"
            - name: GEOIPUPDATE_DB_DIR
              value: /geoip
            - name: GEOIPUPDATE_VERBOSE
              value: "1"
          securityContext:
            runAsUser: 0 # the hostPath directory is owned by root; no capabilities are kept
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
          volumeMounts:
            - name: geoip
              mountPath: /geoip
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: geoip
          hostPath:
            path: /var/lib/geoip
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
