apiVersion: v1
kind: Namespace
metadata:
  name: redis

---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis
  namespace: redis
spec:
  clusterSize: 3
  nodeSelector:
    storage.vmd1.homelab/redis-server: "true"
  redisExporter:
    enabled: true
    image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.12@sha256:22061f566331bbe3dc7c42cfe79fbf5e1ed318e5ee63648ec6ebd79f0ebe4fbe
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: redis-sentinel
  namespace: redis
spec:
  clusterSize: 3
  nodeSelector:
    storage.vmd1.homelab/redis-sentinel: "true"
  redisExporter:
    enabled: true
    image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
  redisSentinelConfig:
    redisReplicationName: redis
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.0.12@sha256:cb2b039352fc6d311fd4c6f2af5f9b0e022b2ac65ea90423f0d3cfabffc78b23
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-haproxy-config
  namespace: redis
data:
  haproxy.cfg: |
    global
        log stdout format raw local0

    defaults
        log     global
        mode    tcp
        timeout connect 4s
        timeout client  30m
        timeout server  30m
        timeout check   2s

    resolvers k8s
        nameserver dns1 10.43.0.10:53
        accepted_payload_size 8192
        hold valid 5s

    frontend redis_front
        bind *:6379
        default_backend redis_back

    backend redis_back
        mode tcp
        option tcp-check
        tcp-check send info\ replication\r\n
        tcp-check expect string role:master
        server-template redis 10 redis-headless.redis.svc.cluster.local:6379 resolvers k8s resolve-prefer ipv4 check inter 2s fall 3 rise 2

---
apiVersion: v1
kind: Service
metadata:
  name: redis-master-lb
  namespace: redis
  labels:
    app: redis-haproxy
  annotations:
    kube-vip.io/loadbalancerIPs: "192.168.12.221"
spec:
  type: LoadBalancer
  loadBalancerClass: kube-vip.io/kube-vip-class
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis-haproxy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-haproxy
  namespace: redis
  labels:
    app: redis-haproxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis-haproxy
  template:
    metadata:
      labels:
        app: redis-haproxy
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        storage.vmd1.homelab/redis-server: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: redis-haproxy
          matchLabelKeys:
            - pod-template-hash
      tolerations:
        - operator: Exists
      containers:
        - name: haproxy
          image: haproxy:2.8-alpine@sha256:094401c230b9bf01a6a4dc96e455795e261483f3bd2f42f19d0e6f259bd43837
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: redis-haproxy-config


