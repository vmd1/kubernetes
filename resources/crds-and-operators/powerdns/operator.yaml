apiVersion: v1
kind: ServiceAccount
metadata:
  name: powerdns-operator
  namespace: powerdns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: powerdns-operator-node-watcher
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: powerdns-operator-node-watcher-binding
subjects:
  - kind: ServiceAccount
    name: powerdns-operator
    namespace: powerdns
roleRef:
  kind: ClusterRole
  name: powerdns-operator-node-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: powerdns-operator-config-manager
  namespace: powerdns
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: powerdns-operator-config-binding
  namespace: powerdns
subjects:
  - kind: ServiceAccount
    name: powerdns-operator
    namespace: powerdns
roleRef:
  kind: Role
  name: powerdns-operator-config-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns-operator
  namespace: powerdns
  labels:
    app: powerdns-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: powerdns-operator
  template:
    metadata:
      labels:
        app: powerdns-operator
    spec:
      serviceAccountName: powerdns-operator
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: operator
          image: ghcr.io/vmd1/powerdns-operator:latest@sha256:9063cf3782bb149ed6a28dbdbe65dce305e15ae748a0bb4f36d6399a3db24470
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLL_INTERVAL
              value: "15"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
