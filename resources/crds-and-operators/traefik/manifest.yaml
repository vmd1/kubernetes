apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  repo: https://traefik.github.io/charts
  chart: traefik
  version: 41.0.1
  targetNamespace: traefik
  valuesContent: |-
    deployment:
      kind: DaemonSet
      dnsPolicy: ClusterFirstWithHostNet

    resources:
      requests:
        cpu: 30m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 4
        maxSurge: 0

    hostNetwork: true

    service:
      enabled: false

    tolerations:
      - operator: "Exists"

    ports:
      web:
        port: 80
        forwardedHeaders:
          trustedIPs:
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      websecure:
        port: 443
        http3:
          enabled: true
        forwardedHeaders:
          trustedIPs:
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      matrix-fed:
        port: 8448
        expose:
          default: true
      dot:
        port: 853
        expose:
          default: true
      traefik:
        port: 81
        expose:
          default: true

    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.http3"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--providers.kubernetescrd.allowCrossNamespace=true"
      # Replace Traefik-generated 429/502/503/504 with the branded pages (Middleware error-pages, infrastructure/traefik).
      # The middleware must exist before this rolls out: merge the infrastructure change first.
      - "--entrypoints.websecure.http.middlewares=traefik-error-pages@kubernetescrd"
      # Header and HTTP/2 limits (defaults: 1 MiB headers, 250 streams per connection)
      - "--entrypoints.websecure.http.maxHeaderBytes=65536"
      - "--entrypoints.websecure.http2.maxConcurrentStreams=100"
      - "--serverstransport.forwardingtimeouts.dialtimeout=15s"
      - "--serverstransport.forwardingtimeouts.responseheadertimeout=15s"
      - "--serverstransport.forwardingtimeouts.idleconntimeout=90s"

    # Local (inline) plugin serving /.vmd1/trace, see infrastructure/traefik/trace.yaml
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    experimental:
      localPlugins:
        vmd1trace:
          moduleName: github.com/vmd1/traefik-trace
          mountPath: /plugins-local/src/github.com/vmd1/traefik-trace
          type: inlinePlugin
          source:
            .traefik.yml: |
              displayName: vmd1 trace
              type: middleware
              import: github.com/vmd1/traefik-trace
              summary: Answers /.vmd1/trace with connection info (host, ip, tls, http, node, region) as text, HTML or JSON.
              testData:
                regions:
                  zeus-01: uk-london-cloud
            go.mod: |
              module github.com/vmd1/traefik-trace

              go 1.22
            plugin.go: |
              // Package traefik_trace answers requests with a description of the connection: plain text (key=value, for
              // curl), HTML (for browsers, same look as the vmd1 error pages) or JSON.
              package traefik_trace

              import (
              	"context"
              	"encoding/json"
              	"fmt"
              	"html"
              	"math"
              	"net"
              	"net/http"
              	"os"
              	"strconv"
              	"strings"
              )

              // Config maps node names to the region label reported as resp-reg, and lists the Cloudflare IP ranges (default: Cloudflare's published list): the
              // CF-IPCountry header is only believed when the TCP peer is inside one of them (anyone can send that header on a
              // direct request to a node).
              type Config struct {
              	Regions         map[string]string `json:"regions,omitempty"`
              	CloudflareCIDRs []string          `json:"cloudflareCIDRs,omitempty"`
              }

              // defaultCloudflareCIDRs is Cloudflare's published edge address list, the same one as the forwardedHeaders.trustedIPs
              // of the Traefik entrypoints (crds-and-operators/traefik/manifest.yaml): keep the two in sync. The middleware config
              // key cloudflareCIDRs replaces it when set.
              var defaultCloudflareCIDRs = []string{
              	"173.245.48.0/20",
              	"103.21.244.0/22",
              	"103.22.200.0/22",
              	"103.31.4.0/22",
              	"141.101.64.0/18",
              	"108.162.192.0/18",
              	"190.93.240.0/20",
              	"188.114.96.0/20",
              	"197.234.240.0/22",
              	"198.41.128.0/17",
              	"162.158.0.0/15",
              	"104.16.0.0/13",
              	"104.24.0.0/14",
              	"172.64.0.0/13",
              	"131.0.72.0/22",
              	"2400:cb00::/32",
              	"2606:4700::/32",
              	"2803:f800::/32",
              	"2405:b500::/32",
              	"2405:8100::/32",
              	"2a06:98c0::/29",
              	"2c0f:f248::/32",
              }

              // CreateConfig creates the default plugin configuration.
              func CreateConfig() *Config {
              	cidrs := make([]string, len(defaultCloudflareCIDRs))
              	copy(cidrs, defaultCloudflareCIDRs)
              	return &Config{Regions: map[string]string{}, CloudflareCIDRs: cidrs}
              }

              type trace struct {
              	regions map[string]string
              	node    string
              	cf      []*net.IPNet
              }

              // info is the connection description; the json tags are the key names of the text and JSON formats.
              type info struct {
              	Host        string `json:"h"`
              	IP          string `json:"ip"`
              	VisitScheme string `json:"visit_scheme"`
              	UserAgent   string `json:"uag"`
              	RespReg     string `json:"resp-reg"`
              	HTTP        string `json:"http"`
              	ReqReg      string `json:"req-reg"`
              	TLS         string `json:"tls"`
              	SNI         string `json:"sni"`
              	Node        string `json:"node-name"`
              }

              // New creates the trace middleware. It never calls next: it is the response.
              func New(_ context.Context, _ http.Handler, config *Config, _ string) (http.Handler, error) {
              	var nets []*net.IPNet
              	for _, c := range config.CloudflareCIDRs {
              		_, n, err := net.ParseCIDR(strings.TrimSpace(c))
              		if err != nil {
              			return nil, fmt.Errorf("cloudflareCIDRs: %v", err)
              		}
              		nets = append(nets, n)
              	}
              	// An empty list trusts nobody: the country is then always "unknown" (fail closed).
              	return &trace{regions: config.Regions, node: os.Getenv("NODE_NAME"), cf: nets}, nil
              }

              // fromCloudflare reports whether the TCP peer is a Cloudflare address.
              func (t *trace) fromCloudflare(req *http.Request) bool {
              	host, _, err := net.SplitHostPort(req.RemoteAddr)
              	if err != nil {
              		host = req.RemoteAddr
              	}
              	ip := net.ParseIP(host)
              	if ip == nil {
              		return false
              	}
              	for _, n := range t.cf {
              		if n.Contains(ip) {
              			return true
              		}
              	}
              	return false
              }

              // validCountry accepts the two-character codes Cloudflare sends (ISO 3166 letters, "XX", "T1" for Tor).
              func validCountry(c string) bool {
              	if len(c) != 2 {
              		return false
              	}
              	for i := 0; i < 2; i++ {
              		ch := c[i]
              		if !((ch >= 'A' && ch <= 'Z') || (ch >= '0' && ch <= '9')) {
              			return false
              		}
              	}
              	return true
              }

              func (t *trace) ServeHTTP(rw http.ResponseWriter, req *http.Request) {
              	region := t.regions[t.node]
              	if region == "" {
              		region = "unknown"
              	}

              	scheme := req.Header.Get("X-Forwarded-Proto")
              	if scheme == "" {
              		scheme = "http"
              		if req.TLS != nil {
              			scheme = "https"
              		}
              	}

              	tlsVersion, sni := "none", "none"
              	if req.TLS != nil {
              		tlsVersion = tlsName(req.TLS.Version)
              		if req.TLS.ServerName != "" {
              			sni = "plaintext"
              		}
              	}

              	// CF-IPCountry is set by Cloudflare, but any client can send it to a node directly, so it is only used when the
              	// request really came through Cloudflare; otherwise the country is unknown (a GeoIP lookup can fill it in later).
              	country := "unknown"
              	if t.fromCloudflare(req) {
              		c := strings.ToUpper(strings.TrimSpace(req.Header.Get("CF-IPCountry")))
              		if validCountry(c) {
              			country = c
              		}
              	}

              	i := info{
              		Host:        clean(req.Host),
              		IP:          clientIP(req),
              		VisitScheme: clean(scheme),
              		UserAgent:   clean(req.UserAgent()),
              		RespReg:     region,
              		HTTP:        httpName(req.Proto),
              		ReqReg:      clean(country),
              		TLS:         tlsVersion,
              		SNI:         sni,
              		Node:        t.node,
              	}

              	// Plain assignments on purpose: Yaegi (Traefik's plugin interpreter) mishandles tuple assignments in switch cases.
              	body := ""
              	contentType := "text/plain; charset=utf-8"
              	format := negotiate(req)
              	if format == "html" {
              		body = renderHTML(i)
              		contentType = "text/html; charset=utf-8"
              		rw.Header().Set("Content-Security-Policy", "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'")
              		rw.Header().Set("X-Robots-Tag", "noindex, nofollow")
              	} else if format == "json" {
              		b, _ := json.Marshal(i)
              		body = string(b) + "\n"
              		contentType = "application/json"
              	} else {
              		body = renderText(i)
              	}

              	rw.Header().Set("Content-Type", contentType)
              	rw.Header().Set("Cache-Control", "no-store")
              	rw.Header().Set("Vary", "Accept")
              	rw.Header().Set("X-Content-Type-Options", "nosniff")
              	rw.WriteHeader(http.StatusOK)
              	if req.Method != http.MethodHead {
              		_, _ = rw.Write([]byte(body))
              	}
              }

              // negotiate picks the format: ?format=text|html|json wins, otherwise browsers (Accept: text/html) get HTML and
              // everything else (curl, scripts) gets plain text.
              func negotiate(req *http.Request) string {
              	switch req.URL.Query().Get("format") {
              	case "text":
              		return "text"
              	case "html":
              		return "html"
              	case "json":
              		return "json"
              	}
              	if strings.Contains(req.Header.Get("Accept"), "text/html") {
              		return "html"
              	}
              	return "text"
              }

              func renderText(i info) string {
              	var b strings.Builder
              	fmt.Fprintf(&b, "h=%s\n", i.Host)
              	fmt.Fprintf(&b, "ip=%s\n", i.IP)
              	fmt.Fprintf(&b, "visit_scheme=%s\n", i.VisitScheme)
              	fmt.Fprintf(&b, "uag=%s\n", i.UserAgent)
              	fmt.Fprintf(&b, "resp-reg=%s\n", i.RespReg)
              	fmt.Fprintf(&b, "http=%s\n", i.HTTP)
              	fmt.Fprintf(&b, "req-reg=%s\n", i.ReqReg)
              	fmt.Fprintf(&b, "tls=%s\n", i.TLS)
              	fmt.Fprintf(&b, "sni=%s\n", i.SNI)
              	fmt.Fprintf(&b, "node-name=%s\n", i.Node)
              	return b.String()
              }

              // The stylesheet is the same as the error pages (github.com/vmd1/error-pages build.py) plus the .kv table.
              const pageHead = `<!doctype html>
              <html lang="en">
              <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="robots" content="noindex, nofollow">
              <title>Connection trace</title>
              <style>
              :root{--bg:#f6f6f4;--fg:#1b1b1a;--muted:#62625e;--accent:#b4442a;--line:#dcdcd6}
              @media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ececea;--muted:#9a9a94;--accent:#e8825f;--line:#2e2e2b}}
              *{box-sizing:border-box}
              html,body{margin:0}
              body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
              main{max-width:34rem;width:100%}
              .code{font:700 clamp(4rem,18vw,7.5rem)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);letter-spacing:-.04em;margin:0}
              .code.sm{font-size:clamp(1.6rem,8vw,2.4rem);letter-spacing:-.02em}
              h1{font-size:1.5rem;margin:.5rem 0 .25rem}
              p{margin:.25rem 0;color:var(--muted)}
              p.lead{color:var(--fg);font-size:1.1rem}
              .actions{margin-top:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap}
              a.btn{display:inline-block;padding:.5rem 1rem;border:1px solid var(--line);border-radius:6px;color:var(--fg);text-decoration:none;font-size:.95rem}
              a.btn:hover,a.btn:focus-visible{border-color:var(--accent);color:var(--accent)}
              footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem 1rem}
              details.ip summary{cursor:pointer;list-style:none;color:var(--muted)}
              details.ip summary::-webkit-details-marker{display:none}
              details.ip summary:hover,details.ip summary:focus-visible{color:var(--accent)}
              details.ip .shown{display:none;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
              details.ip[open] .hidden{display:none}
              details.ip[open] .shown{display:inline}
              h2{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1.5rem 0 .25rem}
              dl.kv{margin:0;border-top:1px solid var(--line)}
              dl.kv div{display:flex;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--line)}
              dl.kv dt{flex:0 0 7.5rem;color:var(--muted)}
              dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font:.9rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
              .map{width:100%;height:auto;display:block;margin:.75rem 0 .25rem}
              .map .land{fill:none;stroke:var(--muted);stroke-opacity:.5;stroke-width:.72;stroke-linecap:round;stroke-dasharray:0 1}
              .map .arc{fill:none;stroke:var(--accent);stroke-width:.45;stroke-linecap:round;stroke-dasharray:1.2 1.2;animation:flow 1.4s linear infinite}
              @keyframes flow{to{stroke-dashoffset:-2.4}}
              @media (prefers-reduced-motion:reduce){.map .arc{animation:none}}
              .map .you{fill:var(--bg);stroke:var(--fg);stroke-width:.5}
              .map .edge{fill:var(--accent)}
              .map .ring{fill:none;stroke:var(--accent);stroke-width:.3;stroke-opacity:.55}
              .map text{font:2.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--fg)}
              .map text.dim{fill:var(--muted)}
              </style>
              </head>
              <body>
              <main>
              `


              // Dotted world map: one path segment per run of land cells on a 120x48 grid (3 degrees per cell,
