# Cloudflare-only origin for vmd1.homelab and every subdomain.
#
# Every vmd1.homelab hostname that serves HTTP is proxied by Cloudflare (dns/domains/vmd1.homelab.js: apex ALIAS and the
# `*` CNAME are CF_PROXY_ON; the DNS-only names are ns1-4, ingress, admins-pc.d and non-cluster targets). Anything
# that reaches an ingress node directly with a vmd1.homelab Host header is bypassing Cloudflare's WAF/rate limits and
# is answered with the same 404 as an unknown host. ClientIP() accepts a single CIDR, hence one term per range. The router matches on the TCP peer (Traefik's ClientIP matcher
# uses RemoteAddr, which the entrypoints' forwardedHeaders.trustedIPs never rewrite), so it cannot be spoofed with
# X-Forwarded-For or CF-Connecting-IP.
#
# Exempt: /health. PowerDNS (edge/powerdns, geoip-zones LUA records) probes https://vmd1.homelab/health
# on every ingress IP with ifurlup() from the nodes' own public addresses; blocking it marks every origin down.
#
# Allowed peers: Cloudflare's published ranges (https://www.cloudflare.com/ips/, same list as the entrypoints'
# trustedIPs in operators/traefik/manifest.yaml; keep the two in sync) plus loopback, the pod and service
# CIDRs and the tailnet. LAN ranges are NOT allowed, so a LAN client with split-horizon DNS for *.vmd1.homelab would be
# blocked; add XXX.XXX.XXX.XXX/16 here if that ever applies.
#
# Priority 900000 sits below /.vmd1/trace (1000000, intentionally answerable on any host and any path of origin)
# and above every site route (rule-length priorities, explicit ones top out at 10000). vmd1.homelab, vmd1.homelab and
# vmd1.homelab are untouched.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vmd1-dev-cloudflare-only
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        HostRegexp(`^(.+\.)?vmd1\.dev$`) && !Path(`/health`) && !(
        ClientIP(`XXX.XXX.XXX.XXX/20`) || ClientIP(`XXX.XXX.XXX.XXX/22`) || ClientIP(`XXX.XXX.XXX.XXX/22`) ||
        ClientIP(`XXX.XXX.XXX.XXX/22`) || ClientIP(`XXX.XXX.XXX.XXX/18`) || ClientIP(`XXX.XXX.XXX.XXX/18`) ||
        ClientIP(`XXX.XXX.XXX.XXX/20`) || ClientIP(`XXX.XXX.XXX.XXX/20`) || ClientIP(`XXX.XXX.XXX.XXX/22`) ||
        ClientIP(`XXX.XXX.XXX.XXX/17`) || ClientIP(`XXX.XXX.XXX.XXX/15`) || ClientIP(`XXX.XXX.XXX.XXX/13`) ||
        ClientIP(`XXX.XXX.XXX.XXX/14`) || ClientIP(`XXX.XXX.XXX.XXX/13`) || ClientIP(`XXX.XXX.XXX.XXX/22`) ||
        ClientIP(`2400:cb00::/32`) || ClientIP(`2606:4700::/32`) || ClientIP(`2803:f800::/32`) ||
        ClientIP(`2405:b500::/32`) || ClientIP(`2405:8100::/32`) || ClientIP(`2a06:98c0::/29`) ||
        ClientIP(`2c0f:f248::/32`) || ClientIP(`XXX.XXX.XXX.XXX/8`) || ClientIP(`::1/128`) ||
        ClientIP(`XXX.XXX.XXX.XXX/16`) || ClientIP(`XXX.XXX.XXX.XXX/16`) || ClientIP(`XXX.XXX.XXX.XXX/10`) ||
        ClientIP(`fd7a:115c:a1e0::/48`))
      kind: Rule
      priority: 900000
      services:
        - name: error-pages
          port: catchall-404
          nativeLB: true
