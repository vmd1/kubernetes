# Region protection for qerobotics.co.uk and every subdomain (the QE Comp event site, routed by the `qerobotics` IngressRoute
# in resources/projects/qecomp): only the UK and private networks get through, everyone else is answered with the same
# 404 as an unknown host.
#
# Allowed:
#  - private peers: loopback, RFC 1918, the tailnet (XXX.XXX.XXX.XXX/10, fd7a:115c:a1e0::/48) and ULA. Pod and service CIDRs sit inside
#    XXX.XXX.XXX.XXX/8. These never pass through Cloudflare, so there is no country to check.
#  - Cloudflare peers whose CF-IPCountry is GB. The header is only believed when the TCP peer is one of Cloudflare's published
#    ranges (same list as cloudflare-only.yaml and the entrypoints' trustedIPs; keep them in sync): a direct request to the
#    ingress with a forged CF-IPCountry is neither private nor Cloudflare and is blocked. ClientIP() matches the TCP peer, not
#    X-Forwarded-For, so it cannot be spoofed.
# Anything else, including visitors Cloudflare could not place ("XX") and Tor ("T1"), gets the 404.
#
# Widening it (say GB and IE): change `^GB$` to `^(GB|IE)$`. The qecomp-server's own Traefik applies the same country check
# (GEO_ALLOW_COUNTRIES) to what reaches it.
#
# Priority 800000: above the qerobotics route (rule-length priority) and below cloudflare-only (900000, vmd1.homelab only).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qerobotics-region
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        HostRegexp(`^(.+\.)?qerobotics\.co\.uk$`) && !(
        ClientIP(`XXX.XXX.XXX.XXX/8`) || ClientIP(`::1/128`) || ClientIP(`XXX.XXX.XXX.XXX/8`) || ClientIP(`XXX.XXX.XXX.XXX/12`) ||
        ClientIP(`XXX.XXX.XXX.XXX/16`) || ClientIP(`XXX.XXX.XXX.XXX/10`) || ClientIP(`fd7a:115c:a1e0::/48`) || ClientIP(`fc00::/7`) ||
        (HeaderRegexp(`CF-IPCountry`, `^GB$`) && (
        ClientIP(`XXX.XXX.XXX.XXX/20`) || ClientIP(`XXX.XXX.XXX.XXX/22`) || ClientIP(`XXX.XXX.XXX.XXX/22`) ||
        ClientIP(`XXX.XXX.XXX.XXX/22`) || ClientIP(`XXX.XXX.XXX.XXX/18`) || ClientIP(`XXX.XXX.XXX.XXX/18`) ||
        ClientIP(`XXX.XXX.XXX.XXX/20`) || ClientIP(`XXX.XXX.XXX.XXX/20`) || ClientIP(`XXX.XXX.XXX.XXX/22`) ||
        ClientIP(`XXX.XXX.XXX.XXX/17`) || ClientIP(`XXX.XXX.XXX.XXX/15`) || ClientIP(`XXX.XXX.XXX.XXX/13`) ||
        ClientIP(`XXX.XXX.XXX.XXX/14`) || ClientIP(`XXX.XXX.XXX.XXX/13`) || ClientIP(`XXX.XXX.XXX.XXX/22`) ||
        ClientIP(`2400:cb00::/32`) || ClientIP(`2606:4700::/32`) || ClientIP(`2803:f800::/32`) ||
        ClientIP(`2405:b500::/32`) || ClientIP(`2405:8100::/32`) || ClientIP(`2a06:98c0::/29`) ||
        ClientIP(`2c0f:f248::/32`))))
      kind: Rule
      priority: 800000
      services:
        - name: error-pages
          port: catchall-404
          nativeLB: true
