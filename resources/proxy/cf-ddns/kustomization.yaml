apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-egress-public
  - ../../policies/components/netpol-api-server

patches:
  # CronJob only: Cloudflare API on the internet and the Kubernetes API. No ingress.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: cf-ddns}
