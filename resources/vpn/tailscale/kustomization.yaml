apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - automation.yaml
  - operator.yaml
  - rbac.yaml
  - apiserver-proxyclass.yaml
  - apiserver-proxygroup.yaml
  - secrets.sops.yaml
  - tailnet-inventory.yaml

configMapGenerator:
  - name: tailnet-inventory-code
    namespace: tailscale
    files: [tailnet_inventory.py=inventory/tailnet_inventory.py]
