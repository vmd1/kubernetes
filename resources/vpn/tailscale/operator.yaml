apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: tailscale-operator
  namespace: kube-system
spec:
  repo: https://pkgs.tailscale.com/helmcharts
  chart: tailscale-operator
  version: 1.104.2
  targetNamespace: tailscale
  valuesContent: |-
    # kubectl over the tailnet is the dedicated ProxyGroup k8s-api (apiserver-proxygroup.yaml), not an
    # in-process proxy in this pod. allowImpersonation gives the ProxyGroup pods the RBAC to impersonate callers.
    apiServerProxyConfig:
      allowImpersonation: "true"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
