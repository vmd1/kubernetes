# The operator talks to every Postgres instance (SQL on 5432, status endpoint on 8000). Namespace set by the patch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-instances
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg}}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8000}
