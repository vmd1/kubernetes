apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy-instances.yaml
  - manifest.yaml
  - operator.yaml
  - scheduled-backup.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  - ../../policies/components/netpol-api-server

patches:
  # Operator webhook and probes 9443, metrics 8080. Egress to the Postgres pods in cnpg (5432 and the 8000 status port) via the local policy.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: cnpg-system}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 9443}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 8080}
