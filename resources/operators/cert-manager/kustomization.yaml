apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - certificate.yaml
  - cluster-issuer.yaml
  - manifest.yaml
  - secrets.sops.yaml

components:
  - ../../policies/components/netpol-baseline
  # Let's Encrypt and the Cloudflare API (egress-public), the Kubernetes API; the API server calls the webhook (10250) from the node's flannel address
  - ../../policies/components/netpol-egress-public
  - ../../policies/components/netpol-api-server

patches:
  # Components carry no namespace; the ports Traefik routes to (and the kubelet or API server call) replace the closed placeholder.
  - target: {kind: NetworkPolicy}
    patch: |-
      - {op: add, path: /metadata/namespace, value: cert-manager}
  # Each component's private vars ConfigMap (a replacement source, never rendered on its own) also needs the namespace, so two
  # enrolled apps in one Flux group do not collide on its name.
  - target: {kind: ConfigMap, name: "cluster-ranges-.*"}
    patch: |-
      - {op: add, path: /metadata/namespace, value: cert-manager}
  - target: {kind: NetworkPolicy, name: allow-ingress-traefik}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports, value: [{protocol: TCP, port: 10250}, {protocol: TCP, port: 6080}, {protocol: TCP, port: 9403}]}
  - target: {kind: NetworkPolicy, name: allow-ingress-monitoring}
    patch: |-
      - {op: replace, path: /spec/ingress/0/ports/0/port, value: 9402}
