# OCIPortRule CRD for oci-port-controller (operators/oci-port-controller).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ociportrules.network.vmd1.homelab
spec:
  group: network.vmd1.homelab
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                nodeName:
                  type: string
                protocol:
                  type: string
                ports:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    maximum: 65535
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                syncedNodes:
                  type: object
                  additionalProperties:
                    type: string
  scope: Cluster
  names:
    plural: ociportrules
    singular: ociportrule
    kind: OCIPortRule
    shortNames:
      - opr
