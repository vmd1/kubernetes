apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tunnelagents.tunnel.vmd1.homelab
spec:
  group: tunnel.vmd1.homelab
  scope: Namespaced
  names:
    kind: TunnelAgent
    listKind: TunnelAgentList
    plural: tunnelagents
    singular: tunnelagent
    shortNames:
      - ta
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Gateway
          type: string
          jsonPath: .status.gateway
        - name: SSH-Port
          type: integer
          jsonPath: .status.ports.ssh
        - name: Connection
          type: string
          jsonPath: .status.connectionType
        - name: Last-Seen
          type: date
          jsonPath: .status.lastSeen
        - name: Bridge
          type: string
          jsonPath: .status.bridge.agentAddress
        - name: Rotated
          type: string
          jsonPath: .status.rotatedAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                suspended:
                  type: boolean
                  default: false
                  description: Revoke the agent's access (it is dropped from the gateway's restrictions) without deleting its credentials.
                expose:
                  type: array
                  description: Services the agent publishes through the fallback tunnel. Default is ssh on 22.
                  items:
                    type: object
                    required: [name, port]
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z0-9]{1,16}$'
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: Port on the agent's server (XXX.XXX.XXX.XXX).
                      tailnetPort:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: Port it is published on over Tailscale (default same as port).
                bridge:
                  type: boolean
                  default: false
                  description: "Give the agent a lab bridge: a Tailscale device in the homelab (<name>-bridge) that forwards every port to the agent over WireGuard, and through which the agent reaches the tailnet. Two-way, all ports. The agent gets the WG_* settings in its agent.env and uses the wireguard / wireguard-wss pathways (needs NET_ADMIN and the kernel WireGuard module on the server). At most BRIDGE_SLOTS agents."
                gateway:
                  type: integer
                  minimum: 0
                  description: Pin the agent to a gateway replica (its reverse tunnels are created there first). Default spreads agents by name.
                rotateAfter:
                  type: string
                  pattern: '^(never|[0-9]+[smhd]?)$'
                  description: "Rotate the agent's credentials after this long, e.g. 90d. Default never (the controller's DEFAULT_ROTATE_AFTER). A running agent reads its credentials once, so automatic rotation cuts it off after rotationGrace unless you redeploy it."
                rotationGrace:
                  type: string
                  pattern: '^[0-9]+[smhd]?$'
                  description: How long the previous credentials keep working after a rotation. Default 24h.
                rotationToken:
                  type: string
                  description: Change this value to rotate the credentials now.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                lastSeen:
                  type: string
                  format: date-time
                  description: "When the gateway last accepted a connection from this agent (read from the gateway logs; refreshed at most every LAST_SEEN_RESOLUTION, default 5m). An agent on the direct Tailscale pathway never touches the gateway, so this only moves while it uses a tunnel pathway."
                bridge:
                  type: object
                  nullable: true
                  description: "The agent's lab bridge (spec.bridge): its slot, the WireGuard addresses on both ends, and the NodePort of the direct UDP endpoint."
                  properties:
                    slot: {type: integer}
                    address: {type: string}
                    agentAddress: {type: string}
                    nodePort: {type: integer}
                connectionType:
                  type: string
                  enum: [via, agent]
                  description: "How the agent last connected. via: Tailscale carried through the gateway (tailscale-wss pathways). agent: the privileged wss-tunnel pathway (reverse tunnels for ssh)."
